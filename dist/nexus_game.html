<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>FantaLiberty — Nexus</title>
<meta name="description" content="FantaLiberty: visual novel interattiva. Steve Jobs Theater, WWDC 26.">
<style>
/* FantaLiberty VN engine — CSS puro, animazioni via @keyframes
   (le keyframe sono piu' affidabili delle transition su mobile Safari) */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0f;overflow:hidden;font-family:'Press Start 2P',monospace}

#stage{position:relative;width:100vw;height:100vh;overflow:hidden;cursor:pointer}

/* ---------- sfondo ---------- */
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;
 transform:scale(1);transition:filter 1.1s ease}
#bg.zoom{animation:zoom 6s ease-out forwards}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.12)}}
#bg.blur{filter:blur(7px) brightness(.6)}

/* ---------- personaggio ---------- */
#char{position:absolute;bottom:16%;right:4%;height:34%;image-rendering:pixelated;
 filter:drop-shadow(0 10px 20px rgba(0,0,0,.55));opacity:0;transform:translateX(60px);
 transition:height .5s ease, bottom .5s ease, right .5s ease}
#char.in{animation:enter .6s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes enter{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
#char.pop{animation:pop .5s ease forwards}
@keyframes pop{0%{opacity:1;transform:scale(1)}45%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
#char.out{animation:leave .45s ease forwards}
@keyframes leave{from{opacity:1}to{opacity:0;transform:translateX(40px)}}

/* ---------- prop / terminale ---------- */
#propwrap{position:absolute;left:50%;top:4%;height:44%;opacity:0;
 transform:translate(-50%,25px) scale(.85);
 transition:opacity .6s ease, transform .7s cubic-bezier(.2,.9,.3,1);pointer-events:none}
#propwrap.in{opacity:1;transform:translate(-50%,0) scale(1)}
#propwrap.out{opacity:0;transform:translate(-50%,-40px) scale(.8)}
#prop{height:100%;display:block;image-rendering:pixelated;filter:drop-shadow(0 16px 30px rgba(0,0,0,.65))}
/* la finestra di testo dentro lo schermo del Mac: percentuali sull'immagine del prop */
#screen{position:absolute;left:27.78%;top:11.94%;width:45.18%;height:28.15%;
 padding:3% 4%;color:#0f3b34;font-size:clamp(5px,1.05vh,12px);line-height:1.75;overflow:hidden}
.frow{margin-bottom:.5em;white-space:nowrap;overflow:hidden}
.fk{opacity:.75}
.fv{font-weight:bold}
.cur{display:inline-block;width:.55em;background:#0f3b34;animation:bl .6s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* ---------- dialog box ---------- */
#boxwrap{position:absolute;left:4%;right:22%;bottom:5%;opacity:0;transform:translateY(18px);
 transition:opacity .5s ease, transform .5s ease}
#boxwrap.in{opacity:1;transform:translateY(0)}
#name{display:inline-block;background:#1b1f33;border:4px solid #fff;border-radius:10px;padding:8px 18px;
 color:#fff;font-size:clamp(9px,1.6vw,15px);margin-left:14px;position:relative;z-index:2;
 box-shadow:0 4px 0 rgba(0,0,0,.5)}
#name.hidden{display:none}
#box{background:#1b1f33;border:4px solid #fff;border-radius:12px;padding:16px 20px;margin-top:-4px;
 color:#fff;font-size:clamp(9px,1.7vw,17px);line-height:1.8;min-height:4.2em;
 box-shadow:0 6px 0 rgba(0,0,0,.5)}
#arrow{text-align:center;color:#fff;font-size:13px;margin-top:6px;opacity:0;animation:bob 1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* ---------- scelte / input ---------- */
#choices{margin-top:14px;display:none;flex-direction:column;gap:8px}
#choices.on{display:flex}
.ch{background:#2a3050;border:3px solid #fff;border-radius:8px;padding:10px 14px;color:#fff;
 font-family:inherit;font-size:clamp(8px,1.5vw,15px);cursor:pointer;text-align:left;
 box-shadow:0 3px 0 rgba(0,0,0,.5)}
.ch:hover,.ch:focus{background:#3d466e;outline:none}
#inputform{margin-top:14px;display:none;gap:8px}
#inputform.on{display:flex}
#ti{flex:1;background:#0d1020;border:3px solid #fff;border-radius:8px;color:#fff;
 font-family:inherit;font-size:clamp(9px,1.6vw,16px);padding:10px 12px;outline:none}
#tok{background:#2a3050;border:3px solid #fff;border-radius:8px;color:#fff;font-family:inherit;
 font-size:clamp(8px,1.5vw,15px);padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.5)}
#tok:disabled{opacity:.35;cursor:default}

#hint{position:absolute;top:14px;right:16px;color:#fff9;font-size:9px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}

#loaderr{position:absolute;inset:0;display:none;place-items:center;padding:8vw;color:#ffb4b4;
 font-size:12px;line-height:2;text-align:center}
#loaderr.on{display:grid}

@media (orientation:portrait){
  #boxwrap{right:4%}
  #char{height:26%;right:2%}
  #propwrap{height:32%}
}

</style>
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <img id="char" alt="">

  <div id="propwrap">
    <img id="prop" alt="">
    <div id="screen"></div>
  </div>

  <div id="boxwrap">
    <div id="name" class="hidden"></div>
    <div id="box"><span id="txt"></span></div>
    <div id="arrow">▼</div>
    <div id="choices"></div>
    <div id="inputform">
      <input id="ti" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Il tuo nome">
      <button id="tok">OK</button>
    </div>
  </div>

  <div id="hint">tap per continuare</div>
  <div id="flash"></div>
  <div id="loaderr">Impossibile caricare <b>game/story.json</b>.<br>
    Apri il gioco da un web server (o usa <b>dist/nexus_game.html</b> per l'uso offline).</div>
</div>

<script>
/* FantaLiberty — motore visual novel data-driven, vanilla JS.
   Nessuna dipendenza: legge game/story.json ed esegue una state machine di step.

   API pubblica:
     VN.boot(story, opts)  -> avvia il gioco
     VN.state              -> variabili correnti (debug / smoke test)
     VN.step()             -> avanza (equivale al click sullo stage)

   Tipi di step supportati (vedi game/story.json):
     say | choice | input | show | hide | prop | bg | fx | wait | set | goto | end
*/
(function (global) {
  'use strict';

  var $ = function (id) { return global.document.getElementById(id); };

  var VN = {
    story: null,
    state: {},      // variabili di gioco (nome, genere, ...)
    scene: null,    // scena corrente
    i: 0,           // indice step nella scena
    speed: 36,      // ms per carattere
    onEnd: null
  };

  var el = {};
  var typing = false, tId = null, pending = null, curLine = '', revealUI = null;

  /* ---------------- testo: interpolazione ---------------- */
  // {nome}          -> valore variabile
  // {NOME}          -> valore variabile in MAIUSCOLO
  // {label:anni}    -> etichetta leggibile dell'opzione scelta
  // {g:uno|una|neutro} -> variante per la variabile di genere (m|f|x)
  function fmt(s) {
    if (!s) return '';
    var genderVar = (VN.story.meta && VN.story.meta.genderVar) || 'genere';
    var order = (VN.story.meta && VN.story.meta.genderOrder) || ['m', 'f', 'x'];
    s = s.replace(/\{g:([^}]*)\}/g, function (_, body) {
      var parts = body.split('|');
      var idx = order.indexOf(VN.state[genderVar]);
      if (idx < 0) idx = order.length - 1;
      return parts[Math.min(idx, parts.length - 1)] || '';
    });
    s = s.replace(/\{label:(\w+)\}/g, function (_, k) {
      var l = VN.state['__label_' + k];
      return l == null ? '' : l;
    });
    return s.replace(/\{(\w+)\}/g, function (m, k) {
      var key = k.toLowerCase();
      var v = VN.state[key];
      if (v == null) return m;
      return k === k.toUpperCase() && k !== k.toLowerCase() ? String(v).toUpperCase() : String(v);
    });
  }

  /* ---------------- typewriter ---------------- */
  function hideUI() {
    el.choices.classList.remove('on');
    el.inputform.classList.remove('on');
    revealUI = null;
  }

  function type(line, after) {
    clearInterval(tId);
    el.arrow.style.opacity = 0;
    hideUI();
    curLine = line; typing = true; pending = null;
    if (!VN.speed) { el.txt.textContent = line; typing = false; return after(); }
    var i = 0; el.txt.textContent = '';
    tId = setInterval(function () {
      el.txt.textContent = line.slice(0, ++i);
      if (i >= line.length) { clearInterval(tId); typing = false; after(); }
    }, VN.speed);
  }

  function skip() {
    if (!typing) return false;
    clearInterval(tId);
    el.txt.textContent = curLine;
    typing = false;
    if (revealUI) { var r = revealUI; revealUI = null; r(); }
    else if (pending) el.arrow.style.opacity = 1;
    return true;
  }

  /* ---------------- step runner ---------------- */
  function next() { VN.i++; run(); }

  function goScene(id) {
    var sc = VN.story.scenes[id];
    if (!sc) throw new Error('scena inesistente: ' + id);
    VN.scene = sc; VN.sceneId = id; VN.i = 0;
    if (sc.bg) setBg(sc.bg, sc.bgFx);
    if (sc.terminal) buildTerminal(sc.terminal);
    run();
  }

  function run() {
    if (!VN.scene) return;
    var steps = VN.scene.steps || [];
    if (VN.i >= steps.length) {
      if (VN.scene.next) return goScene(VN.scene.next);
      return finish();
    }
    exec(steps[VN.i]);
  }

  function finish() {
    VN.scene = null;
    if (typeof VN.onEnd === 'function') VN.onEnd(VN.state);
  }

  function exec(st) {
    switch (st.t) {

      case 'say':
        el.boxwrap.classList.add('in');
        setSpeaker(st.who);
        type(fmt(st.text), function () {
          pending = next;
          el.arrow.style.opacity = 1;
        });
        return;

      case 'choice':
        el.boxwrap.classList.add('in');
        setSpeaker(st.who);
        type(fmt(st.text), function () { showChoices(st); });
        revealUI = function () { showChoices(st); };
        return;

      case 'input':
        el.boxwrap.classList.add('in');
        setSpeaker(st.who);
        type(fmt(st.text), function () { showInput(st); });
        revealUI = function () { showInput(st); };
        return;

      case 'show':
        el.char.src = assetUrl('chars', st.char);
        el.char.classList.remove('out');
        if (st.pop) { el.char.classList.remove('in'); void el.char.offsetWidth; el.char.classList.add('pop'); }
        else { el.char.classList.remove('pop'); void el.char.offsetWidth; el.char.classList.add('in'); }
        if (st.height) el.char.style.height = st.height;
        if (st.bottom) el.char.style.bottom = st.bottom;
        if (st.right) el.char.style.right = st.right;
        return next();

      case 'hide':
        el.char.classList.remove('in', 'pop');
        el.char.classList.add('out');
        return next();

      case 'prop':
        if (st.id) el.prop.src = assetUrl('props', st.id);
        el.propwrap.classList.remove(st.show ? 'out' : 'in');
        el.propwrap.classList.add(st.show ? 'in' : 'out');
        return next();

      case 'bg':
        setBg(st.id || (VN.scene && VN.scene.bg), st.fx);
        return next();

      case 'fx':
        if (st.name === 'flash') {
          el.flash.classList.remove('go'); void el.flash.offsetWidth; el.flash.classList.add('go');
        } else if (st.name === 'blur') {
          el.bg.classList.add('blur');
        } else if (st.name === 'unblur') {
          el.bg.classList.remove('blur');
        }
        return next();

      case 'wait':
        if (!VN.speed) return next();   // speed 0 = modalita' test/skip: nessuna attesa
        return setTimeout(next, st.ms || 400);

      case 'set':
        VN.state[st.var] = st.value;
        termSet(st.var);
        return next();

      case 'goto':
        VN.i = 0;
        return goScene(st.scene);

      case 'end':
        return finish();

      default:
        // step sconosciuto: non blocca il flusso, lo salta
        return next();
    }
  }

  /* ---------------- UI ---------------- */
  function setSpeaker(who) {
    if (who) { el.name.textContent = who; el.name.classList.remove('hidden'); }
    else el.name.classList.add('hidden');
  }

  function showChoices(st) {
    el.choices.innerHTML = '';
    (st.options || []).forEach(function (o) {
      var b = global.document.createElement('button');
      b.className = 'ch';
      b.textContent = fmt(o.label);
      b.onclick = function (ev) {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        hideUI();
        if (st.var) {
          VN.state[st.var] = o.value;
          VN.state['__label_' + st.var] = o.say != null ? o.say : o.label;
          termSet(st.var);
        }
        if (o.goto) return goScene(o.goto);
        next();
      };
      el.choices.appendChild(b);
    });
    el.choices.classList.add('on');
  }

  function showInput(st) {
    var max = st.max || 24;
    var re = st.pattern ? new RegExp(st.pattern, 'g') : /[^A-Za-zÀ-ÿ0-9' ]/g;
    el.ti.value = '';
    el.tok.disabled = true;
    el.ti.oninput = function () {
      var v = el.ti.value.replace(re, '').slice(0, max);
      el.ti.value = v;
      VN.state[st.var] = v;
      termSet(st.var);
      el.tok.disabled = v.trim().length === 0;
    };
    el.ti.onkeydown = function (e) { if (e.key === 'Enter' && !el.tok.disabled) el.tok.click(); };
    el.tok.onclick = function (ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      if (el.tok.disabled) return;
      hideUI();
      termCursorOff();
      next();
    };
    el.inputform.classList.add('on');
    setTimeout(function () { try { el.ti.focus(); } catch (e) {} }, 80);
  }

  /* ---------------- terminale del prop ---------------- */
  var termRows = [];
  function buildTerminal(rows) {
    termRows = rows;
    el.screen.innerHTML = '';
    rows.forEach(function (r) {
      var d = global.document.createElement('div');
      d.className = 'frow';
      d.id = 'trow_' + (r.var || r.key);
      d.innerHTML = '<span class="fk">' + (r.key || '') + '</span> <span class="fv" id="tval_' +
        (r.var || r.key) + '"></span>';
      el.screen.appendChild(d);
    });
    var c = global.document.createElement('span');
    c.className = 'cur'; c.id = 'tcur'; c.textContent = ' ';
    el.screen.appendChild(c);
  }

  function termSet(varName) {
    var row = termRows.filter(function (r) { return r.var === varName; })[0];
    if (!row) return;
    var node = $('tval_' + varName);
    if (!node) return;
    var v = VN.state[varName];
    if (row.map) v = row.map[v] != null ? row.map[v] : v;
    node.textContent = row.upper === false ? String(v == null ? '' : v) : String(v == null ? '' : v).toUpperCase();
  }

  function termCursorOff() { var c = $('tcur'); if (c) c.style.display = 'none'; }

  /* ---------------- asset ---------------- */
  function assetUrl(kind, id) {
    var a = (VN.story.assets && VN.story.assets[kind] && VN.story.assets[kind][id]);
    if (!a) return '';
    // build single-file: gli asset possono essere gia' data: URI
    if (a.indexOf('data:') === 0 || a.indexOf('http') === 0) return a;
    return ((VN.story.meta && VN.story.meta.assetBase) || '') + a;
  }

  function setBg(id, fx) {
    if (id) el.bg.src = assetUrl('bg', id);
    el.bg.classList.remove('zoom', 'blur');
    if (fx) String(fx).split(' ').forEach(function (f) { if (f) el.bg.classList.add(f); });
  }

  /* ---------------- boot ---------------- */
  VN.boot = function (story, opts) {
    opts = opts || {};
    VN.story = story;
    VN.state = {};
    Object.keys(story.vars || {}).forEach(function (k) { VN.state[k] = story.vars[k]; });
    if (opts.speed != null) VN.speed = opts.speed;
    if (opts.onEnd) VN.onEnd = opts.onEnd;

    el = {
      stage: $('stage'), bg: $('bg'), char: $('char'), propwrap: $('propwrap'), prop: $('prop'),
      screen: $('screen'), boxwrap: $('boxwrap'), name: $('name'), txt: $('txt'), arrow: $('arrow'),
      choices: $('choices'), inputform: $('inputform'), ti: $('ti'), tok: $('tok'), flash: $('flash')
    };

    el.stage.onclick = function (e) {
      if (e && e.target && e.target.closest &&
          (e.target.closest('#choices') || e.target.closest('#inputform') || e.target.closest('#propwrap'))) return;
      VN.step();
    };
    global.document.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') {
        if (el.inputform.classList.contains('on') || el.choices.classList.contains('on')) return;
        VN.step();
      }
    });

    goScene((story.meta && story.meta.start) || Object.keys(story.scenes)[0]);
  };

  VN.step = function () {
    if (skip()) return;
    if (pending) { var f = pending; pending = null; el.arrow.style.opacity = 0; f(); }
  };

  global.VN = VN;
})(typeof window !== 'undefined' ? window : globalThis);
