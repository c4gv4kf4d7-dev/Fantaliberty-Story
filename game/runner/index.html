<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════════════════════
   APPLE CAMPUS RUN — il minigioco di FantaLiberty.

   Vive in una pagina sua e il gioco grande lo apre dentro un iframe, sopra
   la scena (engine.js, apriRunner): cosi' chiudendolo il giocatore si
   ritrova esattamente dov'era, come per il regolamento e i quadri della
   Hall of Fame. Si apre anche da solo, aprendo questo indirizzo.

   Il personaggio non si muove mai davvero: scorre il mondo.
   La profondità è una z fra 0 (addosso a noi) e 1 (in fondo);
   la prospettiva è una sola formula, projetta(), usata da tutti.

   Gli asset veri vengono caricati da ../../assets/in_app_game/ se ci sono,
   altrimenti il gioco disegna dei segnaposto e gira lo stesso.
   ══════════════════════════════════════════════════════════════ */

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });

/* ---------- misure: 9:16 dentro qualunque finestra ---------- */
const W = 720, H = 1280;           // risoluzione logica del gioco
cv.width = W; cv.height = H;

function adatta(){
  const box = document.getElementById('stage');
  // visualViewport, quando c'e', e' la misura vera: su Safari mobile le barre
  // del browser si aprono e chiudono senza che "resize" scatti sempre, e la
  // pagina restava incollata alla finestra piu' stretta di quando si era
  // aperta (l'apertura mostra sempre le barre, poi si accorciano da sole).
  const vv = window.visualViewport;
  const w = vv ? vv.width  : innerWidth;
  const h = vv ? vv.height : innerHeight;
  const k = Math.min(w / W, h / H);
  box.style.width  = Math.round(W * k) + 'px';
  box.style.height = Math.round(H * k) + 'px';
}
addEventListener('resize', adatta);
if (window.visualViewport) {
  visualViewport.addEventListener('resize', adatta);
  visualViewport.addEventListener('scroll', adatta);
}
adatta();

/* ---------- geometria del corridoio ----------
   Il corridoio curva, e non di una curva regolare: il bordo sinistro
   prima si allarga e poi rientra. Nessuna formula la indovina, quindi
   i due bordi della pista sono stati TRACCIATI A MANO sul fondale con
   tools/taratura_pista.html, e qui sotto ci sono i punti misurati.

   Coppie [y, x] in coordinate di gioco (720x1280), dall'alto in basso.
   Se un giorno cambia il fondale, si rifa' la taratura e si sostituiscono
   queste due tabelle: non c'e' altro da toccare. */
const PISTA_SX = [[705,198],[724,209],[739,215],[753,213],[772,206],[788,197],
                  [808,188],[824,177],[848,160],[920,113],[995,56],[1039,18]];
const PISTA_DX = [[682,199],[686,240],[688,293],[709,332],[741,390],[788,449],
                  [856,531],[924,601],[1023,693]];

/* Dove FINISCONO in alto le cose appoggiate ai due lati: il bordo del
   soffitto, misurato sul fondale. Coppie [x, y]. La conferma e' che
   questi valori coincidono con la cima dei montanti dipinti nel
   corridoio originale, prima che li togliessimo. */
const CIMA_VETRO  = [[200,605],[240,599],[280,588],[320,572],[360,551],[400,513],
                     [440,463],[480,411],[520,352],[560,290],[600,225],[640,160],
                     [680,95],[700,64]];
/* Dove il vetro POGGIA: e' piu' in basso del bordo della pista, che
   corre dentro la ghiaia. Misurata sulla base dei montanti dipinti
   nel corridoio originale — riconoscibile perche' li' comincia il
   loro riflesso sul pavimento a specchio. */
const BASE_VETRO = [[273,695],[284,699],[295,703],[306,707],[318,713],[331,723],
                    [422,793],[451,826],[494,872],[569,968]];

const CIMA_PARETE = [[0,372],[30,398],[60,424],[90,451],[120,477],[150,507],
                     [170,527],[190,567],[200,605]];

const Y_FONDO = 690;        // dove i due bordi si chiudono, in fondo alla curva
const K       = 7;          // quanto "stringe" la profondita'
const LARGO   = 0.26;       // distanza fra le corsie, in frazione di pista

/* Dove passa un bordo all'altezza y. Fra due punti si va dritti; sopra
   il primo e sotto l'ultimo si prosegue con la pendenza del tratto
   d'estremita' (in basso la pista esce dallo schermo, ed e' giusto cosi'). */
function bordo(t, y){
  if (y <= t[0][0]) return t[0][1];
  const u = t.length - 1;
  if (y >= t[u][0]){
    const [ya,xa] = t[u-1], [yb,xb] = t[u];
    return xb + (xb - xa) * (y - yb) / (yb - ya);
  }
  for (let i=1; i<=u; i++){
    if (y <= t[i][0]){
      const [ya,xa] = t[i-1], [yb,xb] = t[i];
      return xa + (xb - xa) * (y - ya) / (yb - ya || 1);
    }
  }
  return t[u][1];
}
const BANDA_SOTTO = bordo(PISTA_DX, H) - bordo(PISTA_SX, H);

// z=0 → davanti a noi, z cresce andando in fondo.
function proietta(z, corsia){
  const p = Math.min(1.15, 1 / (1 + z * K));
  const y = Y_FONDO + (H - Y_FONDO) * p;
  const L = bordo(PISTA_SX, y), R = bordo(PISTA_DX, y), banda = R - L;
  return {
    p, y,
    x: L + banda * (0.5 + corsia * LARGO),
    scala: banda / BANDA_SOTTO       // la pista misurata da gia' la profondita' giusta
  };
}

/* ---------- asset: se ci sono si usano, se no segnaposto ----------
   La cartella e' una sola e sta qui: la build in file unico (dist/) la
   sostituisce con un elenco di immagini gia' incorporate (window.RUN_INLINE),
   perche' li' non c'e' nessuna cartella da cui pescare. */
const CARTELLA = '../../assets/in_app_game/';
const INLINE = (typeof window !== 'undefined' && window.RUN_INLINE) || null;
/* La stessa versione con cui il gioco ha aperto questa pagina (?v=NN) va
   appesa anche alle immagini. Senza, il browser si tiene quelle di prima anche
   dopo una pubblicazione: la pagina si ricarica perche' l'indirizzo cambia, le
   tavole no. E' gia' successo con il personaggio nuovo — a chi aveva aperto il
   gioco prima restava il vecchio, o niente. Aprendo game/runner/ da solo non
   c'e' nessuna versione e non si appende niente. */
const VERSIONE = (() => {
  try {
    const v = new URLSearchParams(location.search).get('v');
    return v ? '?v=' + encodeURIComponent(v) : '';
  } catch (e) { return ''; }
})();
const A = {};
function carica(nome, file){
  return new Promise(ok => {
    const im = new Image();
    im.onload  = () => { A[nome] = im; ok(); };
    im.onerror = () => { A[nome] = null; ok(); };   // manca: si va di segnaposto
    im.src = (INLINE && INLINE[file]) || (CARTELLA + file + VERSIONE);
  });
}
const PRONTI = Promise.all([
  carica('fondale',   'run_corridoio_scena.webp'),
  carica('montante',  'run_montante.webp'),
  carica('costola',   'run_parete_costola.webp'),
  carica('corsa',     'run_pg_corsa.webp'),
  carica('carrello',  'run_ost_carrello.webp'),
  carica('rosso',     'run_anello_rosso.webp'),
  carica('verde',     'run_anello_verde.webp'),
  carica('blu',       'run_anello_blu.webp'),
  carica('vita',      'run_vita.webp'),
  carica('traguardo', 'run_traguardo.webp'),
  carica('arcobaleno','run_ost_arcobaleno.webp'),
  carica('scivolata', 'run_pg_scivolata.webp'),
  carica('iphone',    'run_bonus_iphone.webp'),
  carica('computer',  'run_bonus_computer.webp'),
  carica('visore',    'run_bonus_visore.webp'),
  carica('cartello',  'run_ost_cartello.webp'),
  carica('salto',     'run_pg_salto.webp'),
  carica('cuffie',    'run_malus_cuffie.webp'),
  carica('cavo',      'run_malus_cavo.webp'),
  carica('batteria',  'run_malus_batteria.webp')
]);

/* Quanti cuori si hanno in partenza. Sta qui e non sparso nel codice perche'
   lo sanno in tre: lo stato iniziale, la fila di cuori in alto a sinistra e la
   ricarica, che col cuore pieno vale punti invece di curare. */
const VITE = 3;

/* ---------- stato ---------- */
const S = {
  fase:'attesa',      // attesa | corsa | fine
  corsia:0,           // -1, 0, +1
  corsiaVista:0,      // posizione morbida, insegue corsia
  velocita:0.62,      // z al secondo
  distanza:0,
  punti:0,
  passo:0,            // fase del ciclo di corsa
  scorri:0,           // scorrimento del pavimento
  cose:[],            // { tipo:'anello'|'ostacolo', z, corsia, anello, presa }
  raccolti:0,         // punti dagli anelli, separati da quelli della corsa
  prossimo:0,         // fra quanta distanza generare il prossimo gruppo
  lezione:null,       // quale spiegazione e' aperta adesso
  imparate:{},        // quelle gia' viste in questa partita
  collezione:{},      // quali dei tre prodotti sono gia' stati presi
  respiro:false,      // il gruppo dopo l'arcobaleno dev'essere innocuo
  scivola:0,
  salto:0,            // quanto manca alla fine del salto          // quanto manca alla fine della scivolata
  traguardo:0,        // l'ultimo migliaio gia' festeggiato
  vite:VITE,
  vitaData:false,     // il cuore di questo livello e' gia' uscito
  vitaQuota:0,        // ...e a che punteggio, dentro il livello, deve uscire
  annuncio:null,      // "LIVELLO n" appena si supera la riga del traguardo
  intoccabile:0,     // dopo un colpo si lampeggia e non si muore due volte
  scossa:0
};
window.RUN = S;   // esposto per il collaudo automatico
const RECORD = 'fl_runner_record';
let record = 0;
try { record = +(localStorage.getItem(RECORD) || 0) || 0; } catch(e){}

/* ---------- generazione del percorso ----------
   Gli anelli sono quelli dell'attivita' dell'orologio, e non sono
   intercambiabili: ognuno vale quanto e' difficile prenderlo.

     VERDE  in fila sulla stessa corsia — si prende correndo dritti
     BLU    alterna le corsie — costringe a zigzagare
     ROSSO  attaccato a un ostacolo — lo prendi e devi schivare subito

   Il colore dice il rischio prima ancora del punteggio: si impara a
   vedere il rosso e prepararsi, che e' esattamente il punto. */
const NASCE = 1.6;   // a che distanza compaiono le cose: e' il tempo di reazione
/* Distanza fra un anello e il successivo. Stretti sembravano un blocco
   solo; larghi si prendono uno per uno, come le monete. */
const PASSO_ANELLI = 0.105;
const ANELLI = {
  verde: { valore: 10 },
  blu:   { valore: 25 },
  rosso: { valore: 50 }
};

function anello(colore, z, corsia){
  S.cose.push({ tipo:'anello', anello:colore, z, corsia });
}
/* ---------- la ricarica ----------
   Uno per livello, e uno solo: il livello e' un tratto con un cuore dentro,
   e chi lo perde se lo tiene fino al prossimo traguardo. Lasciarla al caso
   voleva dire che due partite uguali non avevano la stessa difficolta'.

   A che punto del livello esca e' invece a caso (VITA_PRIMA..VITA_DOPO), se
   no si imparerebbe dove aspettarla — e trovarla sempre al metro giusto la
   farebbe smettere di essere una fortuna. */
const VITA_PRIMA = 120, VITA_DOPO = 600;

function nuovaQuotaVita(){
  S.vitaData = false;
  S.vitaQuota = S.punti + VITA_PRIMA + Math.random() * (VITA_DOPO - VITA_PRIMA);
}

function forseVita(z, corsia){
  if (S.vitaData || S.punti < S.vitaQuota) return;
  S.vitaData = true;
  S.cose.push({ tipo:'vita', z, corsia });
}
/* ---------- le chicche ----------
   Regola, e va tenuta: il carrello e' l'unica cosa che toglie un cuore.

   Sono rimasti solo gli oggetti che hanno un disegno vero. I segnaposto
   grigi e colorati (cubo, matita, adattatore, cavi) sono stati tolti: un
   quadratino anonimo che vale punti non insegna niente, e a schermo
   sembrava un errore piu' che un oggetto. Cosi' nel percorso ci sono tre
   cose sole da leggere — gli anelli, i prodotti nelle bolle, il cuore. */
const CHICCHE = {
  iphone:   { valore: 100, segnaposto:'#2b2b2e', alone:'#4ac6e8' },
  computer: { valore: 100, segnaposto:'#d8cfae', alone:'#f0b722' },
  visore:   { valore: 100, segnaposto:'#cfd0e4', alone:'#b58ce8' }
};
const COLLEZIONE = ['iphone','computer','visore'];
const BONUS_COLLEZIONE = 300;

/* ---------- le fregature ----------
   Stessa forma delle chicche — un oggetto che galleggia dentro una bolla — ma
   la bolla e' ROSSA, ed e' quello a dire la regola: bolla chiara si prende,
   bolla rossa si scansa. Senza quel segnale sarebbero un premio che punisce,
   che e' il modo piu' rapido di far sembrare un gioco rotto.

   Non tolgono cuori: il carrello resta l'unica cosa che ne toglie uno. Queste
   costano punti, e basta — si possono sempre schivare cambiando corsia. */
const MALUS = {
  cuffie:   { valore: -25,  alone:'#e0554d' },
  cavo:     { valore: -50,  alone:'#e0554d' },
  batteria: { valore: -100, alone:'#e0554d' }
};
const FREGATURE = ['cuffie','cavo','batteria'];

function forseMalus(z, corsia){
  if (Math.random() > 0.09) return;
  S.cose.push({ tipo:'malus', quale: FREGATURE[Math.random()*FREGATURE.length | 0], z, corsia });
}

function forseChicca(z, corsia){
  // solo i tre prodotti, uno per partita, e non a ogni gruppo
  if (Math.random() > 0.09) return;
  const restano = COLLEZIONE.filter(k => !S.collezione[k]);
  if (!restano.length) return;
  S.cose.push({ tipo:'chicca', quale: restano[Math.random()*restano.length | 0], z, corsia });
}

/* ---------- l'arcobaleno ----------
   Occupa tutto il corridoio e si passa solo sotto il centro, scivolando.
   La forma dice gia' la regola: un arco e' alto in mezzo e basso ai
   lati, quindi dove ci si passa si vede senza doverlo spiegare.

   E' il primo ostacolo che chiede DUE cose insieme — mettersi al
   centro e scivolare — percio' nasce piu' lontano degli altri: la
   difficolta' dev'essere nel farlo, non nel non avere tempo. */
const NASCE_ARCO = 2.4;
const SCIVOLATA  = 0.55;      // quanto dura, in secondi
const SALTO      = 0.62;      // idem per il salto

function scivola(){
  if (S.fase !== 'corsa' || S.scivola > 0 || S.salto > 0) return;
  S.scivola = SCIVOLATA;
}
function salta(){
  if (S.fase !== 'corsa' || S.salto > 0 || S.scivola > 0) return;
  S.salto = SALTO;
}

/* ---------- i traguardi ----------
   Ogni mille punti un'icona d'oro risale il corridoio piu' grande di
   tutto il resto. NON si raccoglie e non si schiva: passa e basta.
   E' un applauso, non un'altra cosa da inseguire — se si potesse
   prendere diventerebbe l'ennesimo oggetto da valutare in corsa.

   E' anche il metro della velocita': ogni traguardo e' uno scalino. */
const OGNI_TRAGUARDO = 1000;

function controllaTraguardo(){
  const quanti = (S.punti / OGNI_TRAGUARDO) | 0;
  if (quanti <= S.traguardo) return;
  S.traguardo = quanti;
  S.cose.push({ tipo:'traguardo', z:1.15, corsia:0, quota:quanti * OGNI_TRAGUARDO,
                livello: quanti + 1 });
  nuovaQuotaVita();      // livello nuovo, cuore nuovo da trovare
}

function corsiaDiversa(da){
  return [-1,0,1].filter(x => x !== da)[Math.random()*2 | 0];
}

function genera(){
  const c = (Math.random()*3 | 0) - 1;

  /* Dopo l'arcobaleno serve una tregua: ci si rialza dalla scivolata e
     un carrello subito dopo non e' difficile, e' ingiusto. */
  if (S.respiro){
    S.respiro = false;
    for (let i=0; i<4; i++) anello('verde', NASCE + i*PASSO_ANELLI, c);
    S.prossimo = 0.7;
    return;
  }
  /* Il cuore si prova a ogni gruppo, non solo in quelli comodi: e' uno per
     livello e chi lo perde se lo tiene fino al traguardo dopo, quindi non
     puo' dipendere da quale gruppo esce a caso. Esce in una corsia diversa
     da quella del gruppo, cosi' non si appiccica mai a un ostacolo. */
  forseVita(NASCE + 0.34, corsiaDiversa(c));

  const r = Math.random();

  if (r < 0.26){
    // FILA VERDE: nessun ostacolo, si corre dritti e si incassa
    const n = 4 + (Math.random()*2 | 0);
    for (let i=0; i<n; i++) anello('verde', NASCE + i*PASSO_ANELLI, c);
    forseChicca(NASCE + 0.20, c);            // in mezzo alla fila comoda
    forseMalus(NASCE + 0.9, corsiaDiversa(c));
    S.prossimo = 0.62;

  } else if (r < 0.44){
    // ZIGZAG BLU: due terzetti su corsie diverse, obbligano a spostarsi
    const d = corsiaDiversa(c);
    for (let i=0; i<3; i++) anello('blu', NASCE + i*PASSO_ANELLI, c);
    for (let i=0; i<3; i++) anello('blu', NASCE + 0.42 + i*PASSO_ANELLI, d);
    forseChicca(NASCE + 0.16, corsiaDiversa(c));
    forseMalus(NASCE + 0.9, corsiaDiversa(c));
    S.prossimo = 0.75;

  } else if (r < 0.60){
    // CARTELLO: o lo schivi di lato o lo scavalchi
    S.cose.push({ tipo:'cartello', z:NASCE, corsia:c });
    for (let i=0; i<3; i++) anello('verde', NASCE - 0.35 + i*PASSO_ANELLI, c);
    forseChicca(NASCE + 0.30, corsiaDiversa(c));
    S.prossimo = 0.62;

  } else if (r < 0.80){
    // ROSSI DAVANTI ALL'OSTACOLO: si prendono e si schiva all'ultimo
    for (let i=0; i<2; i++) anello('rosso', NASCE + 0.18 + i*PASSO_ANELLI, c);
    S.cose.push({ tipo:'ostacolo', z: NASCE, corsia: c });
    for (let i=0; i<3; i++) anello('verde', NASCE + i*PASSO_ANELLI, corsiaDiversa(c));
    forseChicca(NASCE + 0.42, c);
    S.prossimo = 0.7;

  } else if (r < 0.94){
    // ARCOBALENO: la strada e' libera, il problema e' arrivarci pronti
    S.cose.push({ tipo:'arco', z: NASCE_ARCO, corsia: 0 });
    S.respiro = true;
    for (let i=0; i<4; i++) anello('verde', NASCE_ARCO - 0.60 + i*PASSO_ANELLI, 0);
    S.prossimo = 1.15;

  } else {
    // due ostacoli: resta una corsia sola, e li' ci sono dei blu
    const a = c, b = corsiaDiversa(a);
    S.cose.push({ tipo:'ostacolo', z:NASCE, corsia:a });
    S.cose.push({ tipo:'ostacolo', z:NASCE, corsia:b });
    const sola = [-1,0,1].find(x => x !== a && x !== b);
    for (let i=0; i<3; i++) anello('blu', NASCE + i*PASSO_ANELLI, sola);
    S.prossimo = 0.85;
  }
}

/* ---------- il minitutorial ----------
   Non un elenco di regole prima di cominciare: si gioca, e la prima
   volta che una cosa compare il gioco si ferma e la spiega mentre e'
   li' da vedere. Il riquadro sta in basso apposta, per non coprirla.

   Si vede una volta sola, poi mai piu' (?tutorial=1 lo rimette). */
const IMPARATO = 'fl_runner_tutorial';
let giaImparato = false;
try { giaImparato = localStorage.getItem(IMPARATO) === '1'; } catch(e){}
if (location.search.includes('tutorial=1')) giaImparato = false;

const LEZIONI = {
  comandi: {
    titolo: 'I comandi',
    corpo: '<div class="dita"><span style="--v:-14px">◀</span>' +
           '<span style="--v:14px">▶</span></div>' +
           '<p><b>Destra e sinistra</b> per cambiare corsia.<br>' +
           '<b>Su</b> per saltare · <b>Giù</b> per scivolare.</p>'
  },
  /* Una scheda sola con tutto quello che si incontra: prima erano
     quattro lezioni e il gioco si fermava di continuo nei primi
     trenta secondi, che e' proprio quando uno vuole giocare. */
  punti: {
    titolo: 'Cosa vale cosa',
    corpo: '<p><b class="verde">Anello verde 10</b> · <b class="blu">blu 25</b> · ' +
           '<b class="rosso">rosso 50</b><br>' +
           'I prodotti nelle bolle: <b class="verde">100 a testa</b><br>' +
           'Il cuore ti ridà un tentativo: <b>uno per livello</b><br>' +
           'Le <b class="rosso">bolle rosse</b> tolgono punti: schivale<br><br>' +
           'Carrelli e cartelli ti costano un cuore.<br>' +
           'L\'arcobaleno si passa <b>al centro, scivolando</b>.</p>'
  }
};

function spiega(quale){
  if (giaImparato || S.imparate[quale]) return;
  S.imparate[quale] = true;
  mostraLezione(quale);
}
/* La coda serve al "come si gioca" del menu: le due schede si rivedono una
   dopo l'altra, e alla fine si torna a correre. In partita ne esce una alla
   volta e la coda resta vuota. */
let codaLezioni = [];
function mostraLezione(quale){
  S.lezione = quale;
  S.fase = 'lezione';                       // il mondo si ferma, il disegno no
  document.getElementById('lezTitolo').textContent = LEZIONI[quale].titolo;
  document.getElementById('lezCorpo').innerHTML   = LEZIONI[quale].corpo;
  document.getElementById('lezione').hidden = false;
}
function rivediLezioni(){
  codaLezioni = Object.keys(LEZIONI).slice(1);
  mostraLezione(Object.keys(LEZIONI)[0]);
}
function riprendi(){
  document.getElementById('lezione').hidden = true;
  S.lezione = null;
  if (S.fase === 'lezione'){
    if (codaLezioni.length) return mostraLezione(codaLezioni.shift());
    S.fase = 'corsa';
  } else codaLezioni.length = 0;
}
document.getElementById('lezOk').onclick = riprendi;

/* Quando fermarsi: appena la cosa e' comparsa ed e' ancora lontana,
   cosi' si guarda con calma quello di cui si sta parlando. */
function controllaLezioni(){
  if (giaImparato) return;
  if (!S.imparate.comandi && S.distanza > 0.12) return spiega('comandi');
  if (!S.imparate.punti   && S.distanza > 0.55) return spiega('punti');
}

/* ---------- comandi ---------- */
function muovi(d){
  if (S.fase === 'lezione'){ riprendi(); return; }
  if (S.fase !== 'corsa') return;
  S.corsia = Math.max(-1, Math.min(1, S.corsia + d));
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  { muovi(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { muovi(+1); e.preventDefault(); }
  if (e.key === 'ArrowDown')  { giu(); e.preventDefault(); }
  if (e.key === 'ArrowUp')    { su(); e.preventDefault(); }
});
function su(){
  if (S.fase === 'lezione'){ riprendi(); return; }
  salta();
}
function giu(){
  if (S.fase === 'lezione'){ riprendi(); return; }
  scivola();
}
let tx = 0, ty = 0, tattivo = false;
cv.addEventListener('touchstart', e => {
  const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; tattivo = true;
}, { passive:true });
cv.addEventListener('touchmove', e => {
  if (!tattivo) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 26 && Math.abs(dx) > Math.abs(dy)){
    muovi(dx > 0 ? +1 : -1); tattivo = false;
  } else if (dy > 30 && Math.abs(dy) > Math.abs(dx)){
    giu(); tattivo = false;
  } else if (dy < -30 && Math.abs(dy) > Math.abs(dx)){
    su(); tattivo = false;
  }
}, { passive:true });
cv.addEventListener('touchend', () => { tattivo = false; }, { passive:true });
// col mouse: click sulla metà destra o sinistra
cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect();
  muovi(e.clientX - r.left < r.width/2 ? -1 : +1);
});

/* ---------- disegno: segnaposto ---------- */
function fondaleFinto(){
  // cielo/vetro a destra, parete a sinistra, pavimento
  ctx.fillStyle = '#f2f2ee'; ctx.fillRect(0, 0, W, H);
  // pavimento: gli stessi due bordi misurati sul fondale vero
  ctx.fillStyle = '#e6e6e1';
  ctx.beginPath();
  for (let i=0; i<=20; i++){ const y = Y_FONDO + (H-Y_FONDO)*(i/20); i?ctx.lineTo(bordo(PISTA_SX,y),y):ctx.moveTo(bordo(PISTA_SX,y),y); }
  for (let i=20; i>=0; i--){ const y = Y_FONDO + (H-Y_FONDO)*(i/20); ctx.lineTo(bordo(PISTA_DX,y), y); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#dfe6dc';                       // verde oltre il vetro
  ctx.beginPath(); ctx.moveTo(W, Y_FONDO - 30); ctx.lineTo(W, H);
  for (let i=20; i>=0; i--){ const y = Y_FONDO + (H-Y_FONDO)*(i/20); ctx.lineTo(bordo(PISTA_DX,y), y); }
  ctx.closePath(); ctx.fill();
  // montanti del vetro
  ctx.strokeStyle = 'rgba(60,64,60,.5)'; ctx.lineWidth = 3;
  for (let i=1; i<=9; i++){
    const z = i*i*0.02, q = proietta(z, 1.6);
    ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x, q.y - 640*q.scala); ctx.stroke();
  }
}

function pavimentoFinto(){
  // righe trasversali che scorrono: bastano a dare la velocità
  ctx.strokeStyle = 'rgba(120,124,120,.22)'; ctx.lineWidth = 2;
  for (let i=0; i<26; i++){
    const z = ((i * 0.09) - (S.scorri % 0.09) + 0.09) % 2.34;
    if (z > 1.4) continue;
    const a = proietta(z, -1.9), b = proietta(z, 1.9);
    ctx.globalAlpha = Math.min(1, a.scala * 1.6);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* Un punteggio che cambia senza dire perche' non insegna niente:
   il numero parte da dove hai preso la cosa e sale sfumando. */
const SEGNALI = [];
function segnale(c, testo, buona){
  const q = proietta(Math.max(c.z, 0.02), c.corsia);
  SEGNALI.push({ x:q.x, y:q.y - 120 * q.scala, testo, buona, vita:1 });
}
function disegnaSegnali(dt){
  for (const s of SEGNALI){
    s.vita -= dt * 1.1;
    s.y -= dt * 90;
  }
  while (SEGNALI.length && SEGNALI[0].vita <= 0) SEGNALI.shift();
  ctx.textAlign = 'center';
  ctx.font = 'bold 46px system-ui, -apple-system, sans-serif';
  for (const s of SEGNALI){
    ctx.globalAlpha = Math.max(0, Math.min(1, s.vita));
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.strokeText(s.testo, s.x, s.y);
    ctx.fillStyle = s.buona ? '#2f8f4e' : '#c0453f';
    ctx.fillText(s.testo, s.x, s.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

// macchia a terra sotto un oggetto: dice a colpo d'occhio su che corsia sta
function ombra(x, y, raggio, forza){
  ctx.fillStyle = 'rgba(40,46,52,' + forza + ')';
  ctx.beginPath();
  ctx.ellipse(x, y, raggio, raggio * 0.30, 0, 0, 7);
  ctx.fill();
}

/* ---------- quello che scorre ai lati ----------
   Il fondale e' un guscio fermo: montanti e costole sono pezzi separati
   disegnati sopra, con la stessa prospettiva delle corsie.

   Il parco NON si muove: e' dipinto nel fondale. Una striscia che
   scorreva oltre il vetro e' stata provata e tolta — tagliava gli alberi
   e la giuntura col prato dipinto si vedeva. */
const PASSO_MONTANTE = 0.17;    // ogni quanta profondita' passa un montante
const PASSO_COSTOLA  = 0.55;    // le costole sono molto piu' rade
const FONDO_VISTA    = 1.9;     // fin dove si disegnano

/* Un montante non e' alto "tanto quanto e' vicino": parte dal pavimento
   e ARRIVA AL SOFFITTO. L'altezza viene dalla differenza fra i due bordi
   misurati, non da un moltiplicatore — e' quello che li faceva crescere
   all'infinito come pali della luce.

   La larghezza invece non viene dalle proporzioni del file: montante e
   costola erano disegnati larghi per leggersi da soli, in scena sono
   stecche. */
function fila(img, passo, cima, base, spessore, pista, scarto){
  if (!img) return;
  const n = Math.ceil(FONDO_VISTA / passo);
  for (let i = n; i >= 0; i--){
    const z = i * passo - (S.scorri % passo);
    if (z < 0.015 || z > FONDO_VISTA) continue;
    const q = proietta(z, 0);
    const x = bordo(pista, q.y) + scarto * q.scala;
    const giu = base ? bordo(base, x) : q.y;
    const su = bordo(cima, x);
    const alt = giu - su;
    if (alt < 6) continue;
    const largo = Math.max(2.2, alt * spessore);   // in fondo restano visibili
    ctx.drawImage(img, x - largo/2, su, largo, alt);
  }
}

function sagoma(x, y, s, colore){
  ctx.fillStyle = colore;
  ctx.beginPath();
  ctx.roundRect(x - s*0.28, y - s, s*0.56, s, s*0.14);
  ctx.fill();
}

/* ---------- disegno: personaggio ---------- */
function personaggio(){
  const q = proietta(0.06, S.corsiaVista);
  const alt = 300 * q.scala * 1.74;
  const x = q.x, y = q.y + 10;
  ombra(x, y, alt * 0.20, 0.20);
  // appena colpiti si lampeggia: dice che per un attimo non si muore
  const lampeggia = S.intoccabile > 0 && ((S.intoccabile * 12) | 0) % 2 === 0;
  ctx.globalAlpha = lampeggia ? 0.35 : 1;

  /* Il salto alza il personaggio e scorre i quattro fotogrammi: sale
     fino all'apice e ridiscende sugli stessi, al contrario. */
  let sollevato = 0;
  if (S.salto > 0){
    const t = 1 - S.salto / SALTO;                 // 0 stacco, 1 atterraggio
    sollevato = Math.sin(t * Math.PI) * alt * 0.62;
  }
  if (S.salto > 0 && A.salto){
    const im = A.salto, fw = im.width / 4;
    const t = 1 - S.salto / SALTO;
    const f = Math.min(3, Math.round((t < 0.5 ? t : 1 - t) * 6));
    const w = alt * (fw / im.height);
    ctx.drawImage(im, f * fw, 0, fw, im.height,
                  x - w/2, y - alt - sollevato, w, alt);
  } else if (S.salto > 0){
    ctx.fillStyle = '#3f6ea8';
    ctx.beginPath();
    ctx.roundRect(x - alt*0.26, y - alt*0.9 - sollevato, alt*0.52, alt*0.8, alt*0.14);
    ctx.fill();
  } else if (S.scivola > 0 && A.scivolata){
    const im = A.scivolata, h = alt * 0.5;         // steso: meta' altezza
    const w = h * (im.width / im.height);
    ctx.drawImage(im, x - w/2, y - h, w, h);
  } else if (S.scivola > 0){
    // segnaposto: sagoma bassa e larga, si capisce che e' steso
    ctx.fillStyle = '#3f6ea8';
    ctx.beginPath();
    ctx.roundRect(x - alt*0.30, y - alt*0.45, alt*0.60, alt*0.45, alt*0.12);
    ctx.fill();
  } else if (A.corsa){
    const im = A.corsa, fw = im.width / 4;
    const f = (S.passo | 0) % 4;
    const w = alt * (fw / im.height);
    ctx.drawImage(im, f * fw, 0, fw, im.height, x - w/2, y - alt, w, alt);
  } else {
    const salto = Math.abs(Math.sin(S.passo * Math.PI / 2)) * alt * 0.06;
    sagoma(x, y - salto, alt, '#3f6ea8');
  }
  ctx.globalAlpha = 1;
}

/* ---------- ciclo ---------- */
let ultimo = performance.now(), fpsAcc = 0, fpsN = 0;

function passo(ora){
  requestAnimationFrame(passo);
  let dt = (ora - ultimo) / 1000; ultimo = ora;
  if (dt > 0.05) dt = 0.05;                     // niente salti dopo un blocco

  if (S.fase === 'corsa'){ aggiorna(dt); controllaLezioni(); }
  disegna();

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5){
    document.getElementById('fps').textContent = Math.round(fpsN / fpsAcc) + ' fps';
    fpsAcc = 0; fpsN = 0;
  }
}

function aggiorna(dt){
  /* La velocita' non sale di continuo ma A SCALINI, uno per traguardo.
     Dieci scalini, non sei: fermandosi al sesto il gioco smetteva di
     complicarsi a 6000 punti e da li' in poi si andava avanti a memoria —
     ci si arrivava a 10.000 senza piu' incontrare niente di nuovo.
     salire sempre un pochino diventa subito ingestibile e non si capisce
     perche'. Cosi' invece ogni scalino e' un momento riconoscibile, e in
     mezzo c'e' un tratto in cui si prende la mano. */
  const scalino = Math.min(10, (S.punti / OGNI_TRAGUARDO) | 0);
  const voluta = 0.62 + scalino * 0.20;
  S.velocita += (voluta - S.velocita) * Math.min(1, dt * 1.6);
  const avanti = S.velocita * dt;
  S.distanza += avanti;
  S.scorri   += avanti;
  S.passo    += dt * (7 + S.velocita * 5);
  S.corsiaVista += (S.corsia - S.corsiaVista) * Math.min(1, dt * 14);
  if (S.scossa > 0) S.scossa -= dt;
  if (S.intoccabile > 0) S.intoccabile -= dt;
  if (S.scivola > 0) S.scivola -= dt;
  if (S.salto > 0) S.salto -= dt;
  if (S.annuncio){ S.annuncio.vita -= dt / 1.4; if (S.annuncio.vita <= 0) S.annuncio = null; }

  controllaTraguardo();
  S.prossimo -= avanti;
  if (S.prossimo <= 0) genera();

  for (const c of S.cose){
    c.z -= avanti;
    if (c.presa) continue;
    if (c.tipo === 'traguardo'){
      // si attraversa: niente collisione, ma il passaggio si annuncia
      if (c.z < 0 && !c.passato){ c.passato = true; S.annuncio = { testo: 'LIVELLO ' + c.livello, vita: 1 }; }
      continue;
    }
    if (c.tipo === 'arco'){
      if (c.z < 0.10 && c.z > -0.02 && !c.presa){
        const dentro = Math.abs(S.corsiaVista) < 0.45;   // corsia di mezzo
        if (!(dentro && S.scivola > 0)){
          c.presa = true; colpito(); if (S.fase !== 'corsa') return;
        } else c.presa = true;                            // passato pulito
      }
      continue;
    }
    if (c.tipo === 'ostacolo' && S.intoccabile > 0) continue;
    if (c.tipo === 'cartello'){
      if (S.intoccabile > 0) continue;
      if (c.z < 0.10 && c.z > -0.02 && !c.presa &&
          Math.abs(c.corsia - S.corsiaVista) < 0.55 && S.salto <= 0){
        c.presa = true; colpito(); if (S.fase !== 'corsa') return;
      }
      continue;
    }
    if (c.z < 0.10 && c.z > -0.02 && Math.abs(c.corsia - S.corsiaVista) < 0.55){
      if (c.tipo === 'anello'){
        c.presa = true;
        S.raccolti += ANELLI[c.anello].valore;
      } else if (c.tipo === 'vita'){
        c.presa = true;
        if (S.vite < VITE){ S.vite++; mostraVite('guarito'); faccia('contento'); segnale(c, '+♥', true); }
        else { S.raccolti += 25; segnale(c, '+25', true); }   // col cuore pieno vale punti
      } else if (c.tipo === 'malus'){
        c.presa = true;
        const k = MALUS[c.quale];
        S.raccolti += k.valore;                  // il totale non scende sotto zero
        segnale(c, String(k.valore), false);
      } else if (c.tipo === 'chicca'){
        c.presa = true;
        const k = CHICCHE[c.quale];
        S.raccolti += k.valore;
        segnale(c, '+' + k.valore, true);
        S.collezione[c.quale] = true;
        if (COLLEZIONE.every(x => S.collezione[x])){
          S.raccolti += BONUS_COLLEZIONE;
          segnale({ z:0.06, corsia:S.corsiaVista }, '+' + BONUS_COLLEZIONE, true);
        }
      } else {
        c.presa = true;                          // un carrello colpisce una volta sola
        colpito(); if (S.fase !== 'corsa') return;
      }
    }
  }
  S.cose = S.cose.filter(c => c.z > -0.02);   // superato = fuori scena

  // gli anelli valgono, ma anche il solo restare in piedi
  // sotto zero non si va: un punteggio negativo sembra un guasto
  S.punti = Math.max(0, S.raccolti + ((S.distanza * 4) | 0));
  document.getElementById('punti').textContent = S.punti;
}

function disegna(){
  ctx.save();
  if (S.scossa > 0){
    ctx.translate((Math.random()-.5) * 14 * S.scossa, (Math.random()-.5) * 14 * S.scossa);
  }

  if (A.fondale) ctx.drawImage(A.fondale, 0, 0, W, H);
  else fondaleFinto();

  fila(A.montante, PASSO_MONTANTE, CIMA_VETRO,  BASE_VETRO, 0.014, PISTA_DX, -20);
  fila(A.costola,  PASSO_COSTOLA,  CIMA_PARETE, null,       0.030, PISTA_SX, -25);
  pavimentoFinto();

  // le cose lontane per prime, cosi' le vicine coprono
  const ord = S.cose.slice().sort((a,b) => b.z - a.z);
  for (const c of ord){
    if (c.presa || c.z > NASCE + 0.1 || c.z < -0.02) continue;
    const q = proietta(c.z, c.corsia);

    if (c.tipo === 'anello'){
      const s = 152 * q.scala;
      /* Niente rotazione schiacciata: un anello schiacciato di lato
         sembra rotto, non in movimento. Galleggia appena. */
      const su = s * (1.25 + 0.06 * Math.sin(S.distanza * 5 + c.z * 7));
      ombra(q.x, q.y, s * 0.30, 0.16);
      const im = A[c.anello];
      if (im){
        const w = s * (im.width / im.height);
        ctx.drawImage(im, q.x - w/2, q.y - su, w, s);
      } else {
        ctx.strokeStyle = { rosso:'#c0453f', verde:'#79c245', blu:'#4aa8cc' }[c.anello];
        ctx.lineWidth = Math.max(2, s*0.16);
        ctx.beginPath(); ctx.ellipse(q.x, q.y - su*0.6, s*0.33, s*0.33, 0, 0, 7);
        ctx.stroke();
      }

    } else if (c.tipo === 'chicca'){
      /* Le bolle devono farsi venire voglia: respirano di misura e
         ondeggiano appena. Un oggetto immobile a schermo si ignora. */
      const k = CHICCHE[c.quale];
      const s = 260 * q.scala;
      const su = s * (1.25 + 0.07 * Math.sin(S.distanza*5 + c.z*7));
      const battito = 1 + 0.09 * Math.sin(S.distanza * 7 + c.z * 4);
      const dondolo = 0.10 * Math.sin(S.distanza * 3.5 + c.z * 3);
      ombra(q.x, q.y, s * 0.30, 0.14);
      ctx.save();
      ctx.globalAlpha = 0.5; ctx.fillStyle = k.alone;
      ctx.beginPath(); ctx.ellipse(q.x, q.y - su + s*0.45, s*0.62, s*0.62, 0, 0, 7);
      ctx.fill(); ctx.restore();
      const im = A[c.quale];
      if (im){
        const h = s * battito, w = h * (im.width / im.height);
        ctx.save();
        ctx.translate(q.x, q.y - su + s/2); ctx.rotate(dondolo);
        ctx.drawImage(im, -w/2, -h/2, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = k.segnaposto; ctx.strokeStyle = '#8a8a80';
        ctx.lineWidth = Math.max(2, s*0.06);
        ctx.beginPath(); ctx.roundRect(q.x - s*0.36, q.y - su, s*0.72, s*0.72, s*0.18);
        ctx.fill(); ctx.stroke();
      }

    } else if (c.tipo === 'malus'){
      /* Le chicche respirano piano e ondeggiano: dicono "prendimi". Questa
         trema, piu' stretta e piu' nervosa, e l'alone e' rosso. */
      const k = MALUS[c.quale];
      const s = 240 * q.scala;
      const su = s * (1.25 + 0.05 * Math.sin(S.distanza*6 + c.z*7));
      const tremore = 0.05 * Math.sin(S.distanza * 22 + c.z * 9);
      ombra(q.x, q.y, s * 0.28, 0.14);
      ctx.save();
      ctx.globalAlpha = 0.45; ctx.fillStyle = k.alone;
      ctx.beginPath(); ctx.ellipse(q.x, q.y - su + s*0.45, s*0.60, s*0.60, 0, 0, 7);
      ctx.fill(); ctx.restore();
      const im = A[c.quale];
      if (im){
        const h = s, w = h * (im.width / im.height);
        ctx.save();
        ctx.translate(q.x, q.y - su + s/2); ctx.rotate(tremore);
        ctx.drawImage(im, -w/2, -h/2, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = '#c8443c'; ctx.strokeStyle = '#6d1f1a';
        ctx.lineWidth = Math.max(2, s*0.07);
        ctx.beginPath(); ctx.arc(q.x, q.y - su + s*0.36, s*0.36, 0, 7);
        ctx.fill(); ctx.stroke();
      }

    } else if (c.tipo === 'vita'){
      const s = 140 * q.scala;
      const su = s * (1.3 + 0.07 * Math.sin(S.distanza * 5 + c.z * 7));
      ombra(q.x, q.y, s * 0.28, 0.16);
      const im = A.vita;
      if (im){
        const w = s * (im.width / im.height);
        ctx.drawImage(im, q.x - w/2, q.y - su, w, s);
      } else {
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#d9453f';
        ctx.lineWidth = Math.max(2, s*0.09);
        ctx.beginPath(); ctx.roundRect(q.x - s*0.4, q.y - su, s*0.8, s*0.8, s*0.2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#d9453f';
        ctx.font = 'bold ' + (s*0.55|0) + 'px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('\u2665', q.x, q.y - su + s*0.42);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      }

    } else if (c.tipo === 'arco'){
      const L = bordo(PISTA_SX, q.y), R = bordo(PISTA_DX, q.y);
      const cx = (L + R) / 2, cy = q.y;
      const im = A.arcobaleno;
      if (im){
        /* Il varco dell'immagine e' il 42% della sua altezza: si dimensiona
           su quello, perche' e' l'unica misura che conta — deve starci
           dentro il personaggio steso e non quello in piedi. */
        const h = 720 * q.scala, w = h * (im.width / im.height);
        ctx.drawImage(im, cx - w/2, cy - h, w, h);
      } else {
        const fuoriA = (R - L) / 2, fuoriB = 676 * q.scala;
        const dentroA = (R - L) * 0.20, dentroB = 268 * q.scala;
        const tinte = ['#4a9e3f','#e8c22a','#e88a22','#d94b3f',
                       '#c8409c','#7a48b8','#3f8ad9'];
        for (let k=0; k<tinte.length; k++){
          const t0 = k / tinte.length, t1 = (k+1) / tinte.length;
          const a0 = fuoriA + (dentroA - fuoriA) * t0, b0 = fuoriB + (dentroB - fuoriB) * t0;
          const a1 = fuoriA + (dentroA - fuoriA) * t1, b1 = fuoriB + (dentroB - fuoriB) * t1;
          ctx.fillStyle = tinte[k];
          ctx.beginPath();
          ctx.ellipse(cx, cy, a0, b0, 0, Math.PI, 2*Math.PI);
          ctx.ellipse(cx, cy, a1, b1, 0, 2*Math.PI, Math.PI, true);
          ctx.closePath(); ctx.fill();
        }
      }

    } else if (c.tipo === 'traguardo'){
      const s = 320 * q.scala;
      const su = s * (2.1 + 0.10 * Math.sin(S.distanza * 3 + c.z * 5));
      const cx = q.x, cy = q.y - su + s/2;
      const entra = Math.min(1, (1.25 - c.z) * 3);       // entra sfumando

      /* La riga sul pavimento. La stella in alto dice CHE si e' arrivati a
         mille punti, ma non si attraversa niente: passa per aria e il
         cambio di livello resta una cosa che succede altrove. La riga
         invece si vede arrivare, ci si corre dentro e si sorpassa — ed e'
         li' che la velocita' cambia. Pulsa perche' non e' pavimento: e'
         una cosa che aspetta di essere superata.

         E' un trapezio, non una linea: fra la profondita' del traguardo e
         una un filo piu' vicina. Una linea di spessore fisso a fondo
         corridoio sarebbe spessa uguale che sotto i piedi, e la
         prospettiva si romperebbe.

         Larga quanto il pavimento, NON quanto la pista misurata: la pista
         arriva fin sotto il vetro, e presa tutta la riga passava oltre i
         montanti e finiva a galleggiare sul prato. I montanti stanno a
         corsia 1.6 — la riga si ferma a 1.3, dentro il corridoio, dove il
         pavimento e' pavimento. */
      {
        /* Da lontano il trapezio si schiaccerebbe a un filo di un pixel:
           lo spessore in profondita' cresce con la distanza, cosi' a
           schermo resta piu' o meno alto uguale per tutta la corsa. */
        const spessore = 0.05 + c.z * 0.16;
        const zVicino = Math.max(0.002, c.z - spessore);
        const RIGA = 1.3;
        const A0 = proietta(c.z, -RIGA),   A1 = proietta(c.z, RIGA);
        const B0 = proietta(zVicino, -RIGA), B1 = proietta(zVicino, RIGA);
        const yA = A0.y, yB = B0.y;
        const battito = 0.5 + 0.5 * Math.sin(S.distanza * 11);
        ctx.save();
        ctx.globalAlpha = entra * (0.55 + 0.45 * battito);
        const g = ctx.createLinearGradient(0, yA, 0, yB);
        g.addColorStop(0,   'rgba(240,190,80,.10)');
        g.addColorStop(0.5, 'rgba(255,228,158,.95)');
        g.addColorStop(1,   'rgba(240,190,80,.10)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(A0.x, yA);
        ctx.lineTo(A1.x, yA);
        ctx.lineTo(B1.x, yB);
        ctx.lineTo(B0.x, yB);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.globalAlpha = entra;
      const alone = ctx.createRadialGradient(cx, cy, s*0.25, cx, cy, s*0.95);
      alone.addColorStop(0, 'rgba(240,190,80,.55)');
      alone.addColorStop(1, 'rgba(240,190,80,0)');
      ctx.fillStyle = alone;
      ctx.beginPath(); ctx.arc(cx, cy, s*0.95, 0, 7); ctx.fill();
      const im = A.traguardo;
      if (im){
        const w = s * (im.width / im.height);
        ctx.drawImage(im, cx - w/2, cy - s/2, w, s);
      } else {
        ctx.fillStyle = '#e8b23c'; ctx.strokeStyle = '#a9761c';
        ctx.lineWidth = Math.max(2, s*0.05);
        ctx.beginPath(); ctx.roundRect(cx - s*0.42, cy - s*0.42, s*0.84, s*0.84, s*0.22);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + (s*0.5|0) + 'px system-ui, sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('\u2605', cx, cy + s*0.02);
        ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      }
      /* Il numero va SOPRA: sotto finisce dietro al personaggio, che
         corre proprio li' in mezzo. */
      ctx.font = 'bold ' + Math.max(14, s*0.34|0) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = Math.max(3, s*0.06); ctx.strokeStyle = 'rgba(255,255,255,.92)';
      ctx.strokeText(c.quota, cx, cy - s*0.68);
      ctx.fillStyle = '#b8811f';
      ctx.fillText(c.quota, cx, cy - s*0.68);
      ctx.textAlign = 'left';
      ctx.restore();

    } else if (c.tipo === 'cartello'){
      const s = 200 * q.scala;
      ombra(q.x, q.y, s * 0.34, 0.22);
      if (A.cartello){
        const im = A.cartello, w = s * (im.width / im.height);
        ctx.drawImage(im, q.x - w/2, q.y - s, w, s);
      } else {
        ctx.fillStyle = '#e8c22a'; ctx.strokeStyle = '#7a6412';
        ctx.lineWidth = Math.max(2, s*0.06);
        ctx.beginPath();
        ctx.moveTo(q.x, q.y - s); ctx.lineTo(q.x + s*0.42, q.y);
        ctx.lineTo(q.x - s*0.42, q.y); ctx.closePath();
        ctx.fill(); ctx.stroke();
      }

    } else {
      /* I carrelli sono l'unica cosa da schivare di lato: se sembrano
         bassi si prova a saltarli. Vanno grossi. */
      const s = 400 * q.scala;
      ombra(q.x, q.y, s * 0.34, 0.22);
      if (A.carrello){
        const im = A.carrello, w = s * (im.width / im.height);
        ctx.drawImage(im, q.x - w/2, q.y - s, w, s);
      } else {
        sagoma(q.x, q.y, s, '#2f3540');
      }
    }
  }

  if (S.fase !== 'attesa') personaggio();
  disegnaSegnali(S.fase === 'corsa' ? 0.016 : 0);
  annuncio();
  ctx.restore();
}

/* Il livello raggiunto, scritto a schermo per un attimo dopo che si e'
   passata la riga. Non sta nel corridoio ma sopra tutto, in alto: nel
   corridoio l'unico posto al centro e' quello dove corre il personaggio, e
   qualunque scritta li' finisce dietro di lui. */
function annuncio(){
  const a = S.annuncio;
  if (!a) return;
  const t = a.vita;                       // 1 -> appena passato, 0 -> sparito
  ctx.save();
  ctx.globalAlpha = Math.min(1, t * 2.2);
  ctx.translate(W/2, H * 0.30 - (1 - t) * 40);
  ctx.scale(1 + (1 - t) * 0.12, 1 + (1 - t) * 0.12);
  ctx.font = 'bold 46px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(60,40,0,.55)';
  ctx.strokeText(a.testo, 0, 0);
  ctx.fillStyle = '#ffe49e';
  ctx.fillText(a.testo, 0, 0);
  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

/* ---------- inizio e fine ---------- */
function mostraVite(effetto){
  const box = document.getElementById('vite');
  box.innerHTML = '';
  for (let i=0; i<VITE; i++){
    const c = document.createElement('span');
    c.textContent = '♥';
    if (i >= S.vite) c.className = 'spenta';
    box.appendChild(c);
  }
  /* L'animazione va tolta e rimessa, se no una seconda botta di fila
     non la fa ripartire: il nodo ce l'ha gia' addosso. */
  box.classList.remove('colpito','guarito');
  void box.offsetWidth;
  if (effetto) box.classList.add(effetto);
}

function scoppiaCuore(){
  const box = document.getElementById('vite');
  const perso = box.children[S.vite];        // quello appena spento
  if (!perso) return;
  const r = perso.getBoundingClientRect(), p = box.parentElement.getBoundingClientRect();
  const nodo = document.createElement('div');
  nodo.id = 'scoppio'; nodo.textContent = '♥';
  nodo.style.left = (r.left - p.left) + 'px';
  nodo.style.top  = (r.top  - p.top)  + 'px';
  box.parentElement.appendChild(nodo);
  setTimeout(() => nodo.remove(), 800);
}

function colpito(){
  faccia('male');
  S.vite--;
  S.scossa = 0.3;           // un sussulto breve: il gioco non si ferma mai
  S.intoccabile = 2.0;      // due secondi lampeggiando, poi si riparte
  mostraVite('colpito');
  scoppiaCuore();
  if (S.vite <= 0) finisci();
}

function via(){
  S.fase = 'corsa'; S.corsia = 0; S.corsiaVista = 0;
  S.velocita = 0.62; S.distanza = 0; S.punti = 0; S.raccolti = 0;
  S.cose = []; S.prossimo = 0.4; S.respiro = false; S.scossa = 0; SEGNALI.length = 0;
  S.vite = VITE; S.intoccabile = 0; S.traguardo = 0; S.scivola = 0; S.salto = 0;
  S.annuncio = null;
  nuovaQuotaVita(); mostraVite(null);
  S.imparate = {}; S.collezione = {}; riprendi();
  chiudiUscita();
  document.getElementById('btnIng').hidden = false;
  document.getElementById('veloStart').hidden = true;
  document.getElementById('veloFine').hidden  = true;
  document.getElementById('veloFine').classList.remove('congelato');
  clearTimeout(fermoId); fermoId = null;
  document.getElementById('veloClassifica').hidden = true;
  document.getElementById('hud').classList.remove('spento');
}
/* ---------- il tempo di guardare ----------
   Il tetto e' un obbligo, non un lusso: la classifica non deve MAI fermare il
   gioco, quindi se il database non risponde entro FERMO_MAX i tasti si
   riaccendono lo stesso e la riga resta com'e'. */
const FERMO_MIN = 900;      // il tocco di troppo di chi stava ancora giocando
const FERMO_MAX = 3000;     // oltre non si aspetta nessuno
let fermoDa = 0, fermoId = null;

function congelaFine(){
  fermoDa = performance.now();
  document.getElementById('veloFine').classList.add('congelato');
  clearTimeout(fermoId);
  fermoId = setTimeout(scongelaFine, FERMO_MAX);
}

function scongelaFine(){
  const resta = FERMO_MIN - (performance.now() - fermoDa);
  clearTimeout(fermoId);
  if (resta > 0){ fermoId = setTimeout(scongelaFine, resta); return; }
  fermoId = null;
  document.getElementById('veloFine').classList.remove('congelato');
}

function finisci(){
  S.fase = 'fine'; S.scossa = 0.5;
  riprendi();
  if (!giaImparato && S.imparate.punti){
    giaImparato = true;
    try { localStorage.setItem(IMPARATO, '1'); } catch(e){}
  }
  if (S.punti > record){
    record = S.punti;
    try { localStorage.setItem(RECORD, record); } catch(e){}
  }
  mostraRecord();
  document.getElementById('finePunti').textContent = S.punti;
  document.getElementById('fineNota').textContent =
    S.punti >= record ? 'Nuovo record.' : 'Il record resta ' + record + '.';
  document.getElementById('veloClassifica').hidden = true;
  document.getElementById('veloFine').hidden = false;
  // sulla schermata di morte la X sparisce: li' l'uscita c'e' gia', e restando
  // sarebbe un tasto fuori dal congelamento proprio mentre qualcuno pesta
  chiudiUscita();
  document.getElementById('btnIng').hidden = true;
  // prima si congela, poi si chiede la posizione: al contrario, quando non c'e'
  // nessuna classifica da aspettare, mostraPosizione scongelava un attimo prima
  // che congelassi, e i tasti restavano spenti fino al tetto dei tre secondi
  congelaFine();
  mostraPosizione(0);                 // "aggiornamento..." finche' non torna
  document.getElementById('hud').classList.add('spento');
  avvisa('fine');
  // parte per conto suo, e quando torna riaccende i tasti
  claAggiorna(S.punti | 0);
}

/* ================= la classifica globale =================
   Una tabella sola su Supabase (runner_leaderboard), una riga per giocatore,
   e dentro il MIGLIOR punteggio: non lo storico delle partite. L'identita' non
   la chiede la corsa — arriva dal gioco grande insieme al nome del posto da cui
   si torna (nome scelto in [S0] e id della partita). Aprendo questa pagina da
   sola non arriva niente, e la corsa gira come prima, col record del telefono.

   Niente controlli anti-imbroglio: e' un gioco interno, il punteggio lo manda
   il browser. L'unica cosa che si controlla e' che sia un numero intero e non
   negativo, per non sporcare la tabella con valori impossibili.

   Regola che vale su tutto: la classifica non deve MAI fermare il gioco. Se il
   database non risponde, la riga della posizione resta nascosta, il record del
   telefono continua a valere e si riprova alla partita dopo. */
// esposto per il collaudo automatico, come S: serve a simulare una classifica
// lenta o assente senza toccare il database vero
const CLA = window.CLA = {
  id: null, nome: '', cfg: null,
  mio: 0,            // il miglior punteggio secondo il server
  posizione: 0, quanti: 0,
  top: null,         // le prime dieci, quando arrivano
  inCorso: false, fallita: false
};

function claAttiva(){ return !!(CLA.id && CLA.cfg && CLA.cfg.url && CLA.cfg.chiave); }

function claUrl(coda){
  return CLA.cfg.url.replace(/\/+$/, '') + '/rest/v1/runner_leaderboard' + coda;
}
function claTesta(extra){
  const h = { apikey: CLA.cfg.chiave, Authorization: 'Bearer ' + CLA.cfg.chiave };
  return Object.assign(h, extra || {});
}

/* Il record ufficiale del giocatore, quello che sta sul server. */
async function claMio(){
  const r = await fetch(claUrl('?select=best_score&player_id=eq.' + encodeURIComponent(CLA.id)),
    { headers: claTesta() });
  if (!r.ok) throw new Error('lettura ' + r.status);
  const righe = await r.json();
  return righe.length ? (+righe[0].best_score || 0) : 0;
}

/* Si scrive solo se il punteggio nuovo batte quello che c'e'. La riga e' una
   sola per giocatore: l'upsert la riscrive invece di aggiungerne un'altra. */
async function claSalva(punti){
  const r = await fetch(claUrl(''), {
    method: 'POST',
    headers: claTesta({ 'Content-Type': 'application/json',
                        Prefer: 'return=minimal,resolution=merge-duplicates' }),
    body: JSON.stringify({ player_id: CLA.id, player_name: CLA.nome || 'Anonimo',
                           best_score: punti, updated_at: new Date().toISOString() })
  });
  if (!r.ok) throw new Error('scrittura ' + r.status);
}

/* La posizione: quante persone hanno fatto piu' di te. Si chiede al database di
   contarle (Prefer: count=exact + un intervallo vuoto), cosi' non si scarica
   tutta la tabella per sapere un numero. */
async function claConta(filtro){
  // "limit=1" invece dell'intestazione Range: il browser non lascia impostare
  // Range da uno script, e senza il conteggio tornava sempre zero. Il numero
  // vero arriva comunque in content-range, che e' quello che serve.
  const r = await fetch(claUrl('?select=player_id&limit=1' + (filtro || '')),
    { headers: claTesta({ Prefer: 'count=exact' }) });
  if (!r.ok) throw new Error('conteggio ' + r.status);
  const c = (r.headers.get('content-range') || '').split('/')[1];
  return +c || 0;
}

/* Le prime dieci: punteggio piu' alto per primo, e a parita' chi ci e' arrivato
   prima (updated_at crescente). */
async function claTop(){
  const r = await fetch(claUrl('?select=player_id,player_name,best_score,updated_at'
    + '&order=best_score.desc,updated_at.asc&limit=10'), { headers: claTesta() });
  if (!r.ok) throw new Error('classifica ' + r.status);
  return await r.json();
}

/* Il giro completo a fine partita. Non blocca niente: parte e basta, e quando
   torna aggiorna quello che c'e' a schermo — se il giocatore intanto ha gia'
   ricominciato, il risultato viene semplicemente ignorato. */
async function claAggiorna(punti){
  if (!claAttiva() || CLA.inCorso) return;
  CLA.inCorso = true;
  const primaEro = CLA.posizione;
  try {
    const valido = Number.isFinite(punti) && punti >= 0;
    const p = valido ? Math.floor(punti) : 0;
    const suServer = await claMio();
    if (p > suServer) { await claSalva(p); CLA.mio = p; }
    else CLA.mio = suServer;

    /* I due conteggi vanno insieme, non in fila: la riga della posizione e' la
       cosa che il giocatore aspetta a schermo dopo essere morto, e ogni viaggio
       in piu' e' un secondo in cui rischia di andarsene senza averla letta. */
    const [quanti, sopra] = await Promise.all([
      claConta(''), claConta('&best_score=gt.' + CLA.mio)
    ]);
    CLA.quanti = quanti;
    CLA.posizione = sopra + 1;
    CLA.fallita = false;

    // il record ufficiale e' quello del server: se sul telefono era piu' basso
    // (altro dispositivo, cache pulita) si allinea
    if (CLA.mio > record) {
      record = CLA.mio;
      try { localStorage.setItem(RECORD, record); } catch(e){}
      mostraRecord();
    }
    mostraPosizione(primaEro);

    /* Le prime dieci servono solo al tabellone, che si apre con un tocco in
       piu': si chiedono DOPO aver mostrato la posizione, e se non arrivano
       la riga resta buona lo stesso. */
    try { CLA.top = await claTop(); }
    catch (e) { console.warn('[run] tabellone non disponibile:', e && e.message); }
  } catch (e) {
    CLA.fallita = true;
    mostraPosizione(0);
    console.warn('[run] classifica non disponibile:', e && e.message);
  }
  CLA.inCorso = false;
}

function mostraPosizione(primaEro){
  const riga = document.getElementById('finePosizione');
  const tasto = document.getElementById('btnClassifica');
  riga.classList.remove('arrivata');
  // niente classifica: non c'e' niente da aspettare, ma il tempo di reazione
  // resta — e' quello che salva da chi sta ancora pestando sullo schermo
  if (!claAttiva()) { riga.hidden = true; tasto.hidden = true; scongelaFine(); return; }
  tasto.hidden = false;
  riga.hidden = false;
  if (CLA.fallita) { riga.textContent = 'Classifica non disponibile.'; scongelaFine(); return; }
  if (!CLA.posizione) { riga.textContent = 'Aggiornamento classifica...'; return; }
  // da qui in poi c'e' un numero da leggere: si riaccendono i tasti e la riga
  // si fa notare, cosi' l'occhio ci finisce sopra invece che sul primo bottone
  void riga.offsetWidth;
  riga.classList.add('arrivata');
  scongelaFine();
  let testo = '#' + CLA.posizione + ' di ' + CLA.quanti +
              (CLA.quanti === 1 ? ' giocatore' : ' giocatori');
  // quante persone si sono superate con questa partita: si dice solo se e'
  // successo davvero, e senza farne una festa ogni volta
  const superati = primaEro && CLA.posizione < primaEro ? primaEro - CLA.posizione : 0;
  if (superati) testo += ' · hai superato ' + superati +
                         (superati === 1 ? ' giocatore' : ' giocatori');
  riga.innerHTML = 'CLASSIFICA GLOBALE<br><b>' + testo + '</b>';
}

function disegnaTabellone(){
  const box = document.getElementById('tabellone');
  box.innerHTML = '';
  if (CLA.fallita || !CLA.top) {
    const p = document.createElement('div');
    p.className = 'stato';
    p.textContent = CLA.fallita ? 'CLASSIFICA NON DISPONIBILE' : 'AGGIORNAMENTO...';
    box.appendChild(p);
    return;
  }
  const medaglie = ['oro', 'argento', 'bronzo'];
  let ioNelleDieci = false;
  CLA.top.forEach((r, i) => {
    const mia = r.player_id === CLA.id;
    if (mia) ioNelleDieci = true;
    box.appendChild(rigaClassifica(i + 1, r.player_name, r.best_score,
      (medaglie[i] || '') + (mia ? ' io' : '')));
  });
  // fuori dalle prime dieci: si vede comunque dove si sta, sotto uno stacco
  if (!ioNelleDieci && CLA.posizione) {
    const st = document.createElement('div'); st.className = 'stacco';
    box.appendChild(st);
    box.appendChild(rigaClassifica(CLA.posizione, CLA.nome || 'Tu', CLA.mio, 'io'));
  }
}

function rigaClassifica(pos, nome, punti, classi){
  const d = document.createElement('div');
  d.className = 'riga ' + (classi || '');
  const p = document.createElement('span'); p.className = 'pos'; p.textContent = pos + '.';
  const n = document.createElement('span'); n.className = 'nome'; n.textContent = nome || 'Anonimo';
  const v = document.createElement('span'); v.className = 'punti'; v.textContent = punti;
  d.appendChild(p); d.appendChild(n); d.appendChild(v);
  if (/\bio\b/.test(classi || '')) {
    const tu = document.createElement('span'); tu.className = 'tu'; tu.textContent = 'TU';
    d.appendChild(tu);
  }
  return d;
}

document.getElementById('btnClassifica').onclick = () => {
  disegnaTabellone();
  document.getElementById('veloClassifica').hidden = false;
};

/* Come claAggiorna, ma in sola lettura: la usa il bottone della schermata
   iniziale. Li' non c'e' ancora un punteggio nuovo da confrontare — si
   guarda e basta, niente da scrivere sul server. */
async function claCarica(){
  if (!claAttiva() || CLA.inCorso) return;
  CLA.inCorso = true;
  try {
    CLA.mio = await claMio();
    CLA.quanti = await claConta('');
    CLA.posizione = CLA.mio ? (await claConta('&best_score=gt.' + CLA.mio)) + 1 : 0;
    CLA.top = await claTop();
    CLA.fallita = false;
  } catch (e) {
    CLA.fallita = true;
    console.warn('[run] classifica non disponibile:', e && e.message);
  }
  CLA.inCorso = false;
  disegnaTabellone();
}
document.getElementById('btnClassificaInizio').onclick = () => {
  disegnaTabellone();               // subito quello che c'e' gia' (es. da una corsa prima)
  document.getElementById('veloClassifica').hidden = false;
  claCarica();
};

document.getElementById('btnChiudiClassifica').onclick = () => {
  document.getElementById('veloClassifica').hidden = true;
};


/* ---------- la porta verso il gioco grande ----------
   Aprendo questa pagina da sola non c'e' nessun posto dove tornare, quindi il
   bottone d'uscita non esiste proprio. Dentro FantaLiberty invece la corsa sta
   in un iframe: appena e' pronta lo dice, e il gioco risponde con il nome del
   posto da cui l'ha aperta ("Torna da Peter", "Torna al countdown"). Il nome
   arriva da fuori perche' il gioco lo sa e la corsa no — e passa da un
   messaggio, non dall'indirizzo, cosi' funziona anche nella build in file
   unico, dove questa pagina non ha un indirizzo suo.

   I messaggi non portano niente di personale (punti e record, gia' scritti a
   schermo), quindi '*' basta e non lega la pagina a un dominio solo. */
const dentro = (() => {
  try { return !!(window.parent && window.parent !== window); } catch(e){ return true; }
})();

function avvisa(tipo){
  if (!dentro) return;
  try { window.parent.postMessage({ fl:'runner', tipo, punti:S.punti|0, record:record|0 }, '*'); } catch(e){}
}

/* ---------- la targa: faccia, anello, record ----------
   La faccia cambia su due cose sole, quelle che il giocatore sente addosso: la
   botta e il cuore recuperato. Torna neutra da sola — un'espressione che resta
   appiccicata smette di voler dire qualcosa. */
let facciaId = null;
function faccia(quale, ms){
  const f = document.getElementById('faccia');
  f.classList.remove('male', 'contento');
  if (quale) f.classList.add(quale);
  clearTimeout(facciaId);
  if (quale) facciaId = setTimeout(() => faccia(null), ms || 1100);
}

function mostraRecord(){
  const r = document.getElementById('record');
  if (r) r.textContent = 'HI ' + record;
  const m = document.getElementById('menuRecord');
  if (m) m.textContent = 'RECORD ' + record;
}

function montaTarga(){
  document.getElementById('faccia').style.backgroundImage =
    'url(' + ((INLINE && INLINE['run_avatar.webp']) || (CARTELLA + 'run_avatar.webp' + VERSIONE)) + ')';
  document.getElementById('anellino').src =
    (INLINE && INLINE['run_anello_rosso.webp']) || (CARTELLA + 'run_anello_rosso.webp' + VERSIONE);
  mostraRecord();
}

/* ---------- l'ingranaggio in alto a destra ----------
   Disegnato qui e non caricato come immagine: e' una ruota di quadretti, il
   codice che la genera e' piu' corto del file che la conterrebbe, e non c'e' un
   asset in piu' da pubblicare e da invalidare quando cambia.

   E' una corona piu' otto denti quadrati, non una formula polare: a quindici
   quadretti il coseno dell'angolo fa denti di larghezza diversa e la ruota
   sembra un fiocco di neve. Cosi' invece i denti sono tutti uguali. */
function disegnaIngranaggio(nodo){
  const N = 15, C = (N - 1) / 2, R_INT = 2.4, R_EST = 4.8;
  const DENTI = [[6,0],[6,12],[0,6],[12,6],[2,2],[10,2],[2,10],[10,10]];
  const g = [];
  for (let y = 0; y < N; y++){
    g.push([]);
    for (let x = 0; x < N; x++){
      const r = Math.hypot(x - C, y - C);
      g[y].push(r >= R_INT && r <= R_EST ? 1 : 0);
    }
  }
  DENTI.forEach(([x0, y0]) => {
    for (let y = y0; y < y0 + 3; y++) for (let x = x0; x < x0 + 3; x++)
      if (x >= 0 && x < N && y >= 0 && y < N) g[y][x] = 1;
  });
  const pezzi = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (g[y][x]) pezzi.push('<rect x="' + x + '" y="' + y + '" width="1" height="1"/>');
  nodo.innerHTML =
    '<svg viewBox="-1 -1 ' + (N + 2) + ' ' + (N + 2) + '" shape-rendering="crispEdges" aria-hidden="true">' +
    '<rect x="-1" y="-1" width="' + (N + 2) + '" height="' + (N + 2) + '" fill="#100e0d"/>' +
    '<rect x="-0.4" y="-0.4" width="' + (N + 0.8) + '" height="' + (N + 0.8) + '" fill="#f0b722"/>' +
    '<g fill="#241c05">' + pezzi.join('') + '</g></svg>';
}

/* ---------- uscire mentre si corre ----------
   La X e' l'unica via d'uscita durante la partita, e apre un menu invece di
   uscire di colpo: uscire e' l'unica cosa irreversibile che si puo' fare qui
   dentro. Mentre il menu e' aperto il mondo si ferma — chiedere "sei sicuro?"
   lasciando arrivare i carrelli sarebbe una domanda a tradimento. */
let faseFermata = null;
// vero quando una via d'uscita esiste davvero: dentro il gioco grande, o con
// la scorciatoia ?esci= che serve a provare questa parte da soli
let uscitaPronta = false;

/* ---------- il menu dell'ingranaggio ----------
   Ferma il gioco come il menu dell'uscita, e per la stessa ragione: e' l'unico
   posto da cui si cambiano le cose, e cambiarle mentre arrivano i carrelli non
   ha senso. La musica non e' della corsa — e' quella del gioco grande, che
   continua a suonare sotto — quindi l'interruttore la chiede a lui, e se non
   c'e' nessun gioco grande la voce non compare proprio. */
let musicaOn = null;

function scriviMusica(){
  const b = document.getElementById('mnMusica');
  if (musicaOn === null) { b.hidden = true; return; }
  b.hidden = false;
  b.textContent = 'MUSICA: ' + (musicaOn ? 'ON' : 'OFF');
}

function apriMenu(){
  if (S.fase === 'attesa' || S.fase === 'fine') return;
  if (!document.getElementById('menu').hidden) return;
  faseFermata = S.fase;
  S.fase = 'menu';
  mostraRecord();
  document.getElementById('menu').hidden = false;
}

function chiudiMenu(){
  document.getElementById('menu').hidden = true;
  if (S.fase === 'menu') S.fase = faseFermata || 'corsa';
  faseFermata = null;
}

function apriUscita(){
  if (S.fase === 'fine' || S.fase === 'attesa') return;
  if (!document.getElementById('uscita').hidden) return;
  faseFermata = S.fase;
  S.fase = 'menu';
  document.getElementById('uscita').hidden = false;
}

function chiudiUscita(){
  document.getElementById('uscita').hidden = true;
  if (S.fase === 'menu') S.fase = faseFermata || 'corsa';
  faseFermata = null;
}

function mostraUscita(etichetta){
  ['btnEsciStart','btnEsciFine'].forEach(id => {
    const b = document.getElementById(id);
    b.textContent = etichetta;
    b.hidden = false;
    b.onclick = () => avvisa('esci');
  });
  uscitaPronta = true;
  const g = document.getElementById('btnIng');
  if (S.fase !== 'attesa' && S.fase !== 'fine') g.hidden = false;
  document.getElementById('btnEsciSi').textContent = etichetta.toUpperCase();
  document.getElementById('btnEsciSi').onclick = () => avvisa('esci');
}

addEventListener('message', e => {
  const m = e && e.data;
  if (!m || m.fl !== 'gioco') return;
  // il gioco grande risponde all'interruttore dicendo com'e' andata a finire
  if (m.tipo === 'musica'){
    if (typeof m.on === 'boolean') { musicaOn = m.on; scriviMusica(); }
    return;
  }
  if (m.tipo !== 'apri') return;
  mostraUscita(m.esci || 'ESCI');
  if (typeof m.musica === 'boolean') { musicaOn = m.musica; scriviMusica(); }
  // l'identita' e' quella che il giocatore ha gia': non si chiede niente qui
  if (m.playerId) { CLA.id = String(m.playerId); CLA.nome = String(m.playerName || ''); }
  if (m.backend) CLA.cfg = m.backend;
  // il bottone della schermata iniziale si vede da subito, non solo a fine
  // partita: non serve aver gia' giocato per guardare la classifica
  document.getElementById('btnClassificaInizio').hidden = !claAttiva();
});

/* Gancio per le verifiche automatiche: con ?prova nell'indirizzo la pagina
   espone lo stato e la fine partita, cosi' un test puo' chiudere una corsa con
   un punteggio deciso invece di doverla giocare. Senza quel parametro non
   esiste, e nel gioco vero l'indirizzo non ce l'ha mai. */
try {
  if (/(^|[?&])prova(=|&|$)/.test(location.search)) window.__prova = { S, finisci };
} catch(e){}

// scorciatoia per provare la pagina da sola con il bottone acceso: ?esci=Chiudi
try {
  const q = new URLSearchParams(location.search).get('esci');
  if (q) mostraUscita(q);
} catch(e){}
/* ---------- il menu, montato una volta sola ----------
   L'ingranaggio e le sue voci non dipendono dal gioco grande, tranne la musica
   (che e' sua) e l'uscita (che senza di lui non porta da nessuna parte). */
disegnaIngranaggio(document.getElementById('btnIng'));
document.getElementById('btnIng').onclick = apriMenu;
document.getElementById('mnRiprendi').onclick = chiudiMenu;
document.getElementById('mnMusica').onclick = () => avvisa('musica');
document.getElementById('mnComandi').onclick = () => { chiudiMenu(); rivediLezioni(); };
document.getElementById('mnClassifica').onclick = () => {
  disegnaTabellone();
  document.getElementById('veloClassifica').hidden = false;
  claCarica();
};
document.getElementById('mnEsci').onclick = () => { chiudiMenu(); apriUscita(); };
scriviMusica();
montaTarga();

document.getElementById('btnVia').onclick    = via;
document.getElementById('btnAncora').onclick = via;
mostraRecord();

PRONTI.then(() => {
  // Un asset che non arriva non si racconta al giocatore: al suo posto il
  // gioco disegna il segnaposto e gira lo stesso. Resta scritto in console,
  // che e' il posto giusto per chi sviluppa.
  const mancanti = Object.keys(A).filter(k => !A[k]);
  if (mancanti.length) console.warn('[run] segnaposto per:', mancanti.join(', '));
  avvisa('pronto');
  // Le barre del browser finiscono di sistemarsi un attimo dopo il primo
  // disegno (specie su Safari, appena aperta la pagina): si ricontrolla la
  // misura ora che il gioco e' davvero pronto, non solo al primo resize.
  setTimeout(adatta, 50);
  requestAnimationFrame(passo);
});

})();
