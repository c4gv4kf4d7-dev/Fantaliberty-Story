<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FantaLiberty — Apple Campus Run</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; overflow:hidden; overflow:clip;
    background:#111; touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #wrap{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  }
  #stage{
    position:relative; background:#e9e9e4;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  canvas{ display:block; width:100%; height:100%; }

  /* ---- interfaccia sopra il canvas ---- */
  .ui{
    position:absolute; inset:0; pointer-events:none;
    display:flex; flex-direction:column;
  }
  #hud{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:12px 12px; transition:opacity .25s;
  }
  /* cuori e punteggio non hanno senso prima di cominciare, e dietro al
     velo della schermata iniziale si intravedevano */
  #hud.spento{ opacity:0; }

  /* ---- la targa in alto a sinistra ----
     Una targa sola invece di due angoli separati: la faccia, i cuori e il
     punteggio sono la stessa informazione — come sto andando — e stando
     insieme si leggono con un'occhiata sola invece che due.

     I bordi sono duri e a gradini, senza raggi ne' sfumature: e' il linguaggio
     del resto del gioco, e sul corridoio chiarissimo un pannello scuro con il
     bordo nero e' l'unica cosa che resta leggibile sempre. */
  #targa{
    display:inline-flex; flex-direction:column; gap:6px;
    padding:7px 9px 8px; background:#2b2521; color:#f4f4f0;
    box-shadow:0 0 0 3px #100e0d,
               inset 2px 2px 0 rgba(255,255,255,.10),
               inset -2px -2px 0 rgba(0,0,0,.45),
               0 3px 0 4px rgba(0,0,0,.28);
  }
  #targaAlto{ display:flex; align-items:center; gap:9px; }
  #ritratto{
    width:52px; height:52px; flex:none; background:#4a3f37;
    box-shadow:0 0 0 3px #100e0d,
               inset 2px 2px 0 rgba(255,255,255,.12),
               inset -2px -2px 0 rgba(0,0,0,.4);
    overflow:hidden;
  }
  /* Il foglio ha tre facce in fila: si scorre con la posizione dello sfondo,
     cosi' cambiare espressione non ricarica niente e non puo' sfarfallare. */
  #faccia{
    width:100%; height:100%;
    background-repeat:no-repeat; background-size:300% 100%;
    background-position:0% 0; image-rendering:pixelated;
    transform:scale(1.18); transform-origin:50% 22%;
  }
  #faccia.male{ background-position:50% 0; }
  #faccia.contento{ background-position:100% 0; }

  #targaBasso{ display:flex; align-items:center; gap:7px; }
  #anellino{ width:22px; height:22px; flex:none; display:block;
    image-rendering:pixelated; animation:giraAnello 2.4s linear infinite; }
  @keyframes giraAnello{ to{ transform:rotate(360deg) } }
  #punti{ font-family:'Press Start 2P', monospace; font-size:15px;
    color:#f0b722; text-shadow:2px 2px 0 #100e0d; letter-spacing:1px; }
  #record{ font-family:'Press Start 2P', monospace; font-size:9px;
    color:#8f8880; margin-left:auto; padding-left:8px; white-space:nowrap; }

  /* ---- l'ingranaggio in alto a destra ----
     Stessa pastiglia della X di prima, altro colore: qui non si esce, si apre
     un menu, e l'oro e' il colore dei comandi in tutto il resto della corsa. */
  #btnIng{
    pointer-events:auto; border:0; background:transparent; padding:0; margin:0;
    width:38px; height:38px; cursor:pointer; flex:none; display:block;
    opacity:.95; transition:opacity .2s;
  }
  #btnIng[hidden]{ display:none !important; }
  #btnIng:active{ transform:translateY(1px); }
  #btnIng svg{ display:block; width:100%; height:100%;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.45)); }

  /* i cuori: uno per tentativo. Al posto della barra della vita del pacchetto
     di riferimento: qui le vite sono tre e contarle e' piu' immediato che
     leggere quanto e' piena una barra. */
  /* La X sta in alto a sinistra, prima dei cuori, che si spostano di conseguenza:
     e' l'angolo dove la si cerca, ed e' l'unica via d'uscita mentre si corre.
     #hud non prende tocchi (sta dentro .ui), quindi il tasto se li riprende. */
  #sinistra{ display:flex; align-items:center; gap:10px; }
  #vite{ display:flex; gap:4px; font-size:24px; line-height:1; }
  #vite span{ color:#e04b44; text-shadow:2px 2px 0 #100e0d; }
  #vite span.spenta{ color:#5a5049; text-shadow:2px 2px 0 #100e0d; opacity:1; }
  #vite.colpito span{ animation: tremaCuore .45s ease-out; }
  #vite.guarito span:not(.spenta){ animation: pulsaCuore .5s ease-out; }
  @keyframes tremaCuore{
    0%,100%{ transform:translateX(0) }
    15%{ transform:translateX(-5px) rotate(-8deg) }
    35%{ transform:translateX(5px) rotate(7deg) }
    55%{ transform:translateX(-4px) rotate(-5deg) }
    75%{ transform:translateX(3px) rotate(3deg) }
  }
  @keyframes pulsaCuore{
    0%,100%{ transform:scale(1) } 45%{ transform:scale(1.45) }
  }
  /* Il cuore perso non sbiadisce e basta: schizza in alto e scoppia.
     Vive in un nodo suo, staccato dalla fila, se no la fila si sposta. */
  #scoppio{
    position:absolute; pointer-events:none; font-size:25px; color:#d9453f;
    animation: scoppiaCuore .75s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes scoppiaCuore{
    0%   { transform:translate(0,0) scale(1); opacity:1 }
    35%  { transform:translate(0,-46px) scale(1.9) rotate(-12deg); opacity:1 }
    100% { transform:translate(0,-72px) scale(3.2) rotate(10deg); opacity:0 }
  }
  #fps{
    position:absolute; left:16px; bottom:12px; font-size:11px;
    color:#2a2a28; opacity:.45; font-weight:600;
  }

  /* ---- schermata iniziale, alla maniera dei cabinati ----
     Press Start 2P e' il font del gioco vero, sta gia' nel repo. E'
     bellissimo per un titolo e illeggibile per una frase: il corpo del
     testo resta in caratteri normali. */
  @font-face{
    font-family:'Press Start 2P';
    src:url('../../assets/font/press-start-2p.woff2') format('woff2');
    font-display:swap;
  }
  /* Il corridoio dell'accesso STAFF ONLY, non un fondo piatto: e' la stessa
     inquadratura che si vede subito prima che la corsa si apra, quindi il
     menu non sembra un cabinato scollegato dal resto del gioco. Il velo
     scuro sopra serve solo a far leggere il titolo e i bottoni. */
  #veloStart{
    background:
      linear-gradient(180deg, rgba(18,18,22,.62) 0%, rgba(18,18,22,.55) 45%, rgba(18,18,22,.92) 100%),
      url('../../assets/bg/bg_campus_run_corridor.webp') center 30% / cover no-repeat;
    color:#f4f4f0; gap:0;
  }
  #titolo{
    font-family:'Press Start 2P', monospace; line-height:1.75;
    text-align:center; margin-bottom:26px;
  }
  #titolo .r1{ display:block; font-size:22px; color:#f4f4f0;
               text-shadow:4px 4px 0 #c0453f; }
  #titolo .r2{ display:block; font-size:22px; color:#f4f4f0;
               text-shadow:4px 4px 0 #79c245; }
  #titolo .r3{ display:block; font-size:40px; margin-top:10px; color:#f0b722;
               text-shadow:5px 5px 0 #4aa8cc; }
  #veloStart p{ color:#cfcfc8; max-width:20em; }
  #veloStart p + p{ margin-top:10px; }

  /* Il bottone e' un tasto vero: ha uno spessore sotto, e premendolo
     scende. Senza quello sembra un collegamento, non un pulsante. */
  #btnVia{
    font-family:'Press Start 2P', monospace; font-size:22px; letter-spacing:2px;
    margin-top:30px; padding:20px 42px; border-radius:0; cursor:pointer;
    background:#79c245; color:#12210a; border:4px solid #12210a;
    box-shadow:0 8px 0 #3f7a1e, 0 8px 0 4px #12210a;
    transition:transform .05s, box-shadow .05s;
    animation:lampeggiaTasto 1.6s steps(1,end) infinite;
  }
  #btnVia:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #3f7a1e, 0 2px 0 4px #12210a;
  }
  @keyframes lampeggiaTasto{
    0%,70%{ background:#79c245 } 71%,100%{ background:#9ade63 }
  }
  /* Il bottone per uscire non e' un tasto da retrogame: e' la porta, e non
     deve competere con PLAY. Compare solo quando il gioco e' aperto dentro
     FantaLiberty (l'indirizzo porta ?esci=...), altrimenti resta nascosto. */
  .velo button.esci{
    margin-top:20px; padding:11px 22px; font-size:13px; font-weight:700;
    letter-spacing:.3px; border:2px solid #a8a8a0; border-radius:999px;
    background:transparent; color:#5a5a54; font-family:inherit;
    box-shadow:none; white-space:nowrap;
  }
  .velo button.esci:active{ transform:translateY(1px); box-shadow:none;
    background:rgba(0,0,0,.06); }
  /* le due schermate hanno fondi opposti — la home e' scura, il fine partita
     chiaro — e lo stesso grigio non si legge su tutti e due */
  #veloStart button.esci{ border-color:#5d5d57; color:#a9a9a2; }
  #veloStart button.esci:active{ background:rgba(255,255,255,.08); }
  .velo button.esci[hidden]{ display:none !important; }

  .velo{
    position:absolute; inset:0; pointer-events:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
    background:rgba(238,238,233,.86); backdrop-filter:blur(3px);
  }
  .velo[hidden]{ display:none !important; }
  .velo h1{ margin:0; font-family:'Press Start 2P', monospace; font-size:22px;
            color:#1d1d1b; letter-spacing:0; }
  .velo p{ margin:0; font-size:15px; line-height:1.5; color:#4a4a46; max-width:19em; }
  .velo .big{ font-family:'Press Start 2P', monospace; font-size:38px;
              color:#1d1d1b; margin:14px 0 6px; }
  .velo button{
    font-family:'Press Start 2P', monospace; font-size:15px; letter-spacing:1px;
    margin-top:18px; padding:16px 30px; border-radius:0; cursor:pointer;
    background:#f0b722; color:#2a1d00; border:4px solid #2a1d00;
    box-shadow:0 7px 0 #a97c12, 0 7px 0 4px #2a1d00;
    transition:transform .05s, box-shadow .05s;
  }
  .velo button:active{
    transform:translateY(5px);
    box-shadow:0 2px 0 #a97c12, 0 2px 0 4px #2a1d00;
  }

  /* ---- la classifica ----
     Non e' un pannello da applicazione: e' il tabellone dei punteggi di un
     cabinato. Stesso font del titolo, stessi bordi spessi, stessi colori. */
  .velo .posizione{
    font-family:'Press Start 2P', monospace; font-size:11px; line-height:1.9;
    color:#4a4a46; margin-top:4px;
  }
  .velo .posizione b{ color:#1d1d1b; }
  /* Appena si muore la schermata compare sotto il dito di chi stava ancora
     giocando, e il tocco di troppo lo porta fuori prima che abbia letto dove e'
     arrivato. Per un attimo i tasti non si toccano: si spengono e si riaccendono
     quando la riga della classifica e' arrivata. */
  .velo.congelato button{ pointer-events:none; opacity:.4; }
  .velo .posizione.arrivata{ animation: entraPosizione .5s ease-out; }
  @keyframes entraPosizione{
    0%   { transform:scale(.82); opacity:0 }
    55%  { transform:scale(1.06); opacity:1 }
    100% { transform:scale(1); opacity:1 }
  }
  .velo button.secondario{
    margin-top:12px; padding:12px 22px; font-size:12px;
    background:#e9e9e4; color:#1d1d1b; border:4px solid #1d1d1b;
    box-shadow:0 6px 0 #a8a8a0, 0 6px 0 4px #1d1d1b;
  }
  .velo button.secondario:active{
    transform:translateY(4px); box-shadow:0 2px 0 #a8a8a0, 0 2px 0 4px #1d1d1b;
  }
  .velo button.secondario[hidden]{ display:none !important; }
  /* fondo pieno: sotto c'e' la schermata chiara del fine partita, e in
     trasparenza si leggeva attraverso i punteggi */
  #veloClassifica{ background:#16161a; justify-content:flex-start;
    padding:calc(28px + env(safe-area-inset-top)) 20px 24px; gap:0; }
  #veloClassifica h1.titoloClassifica{ color:#f0b722; font-size:18px;
    text-shadow:4px 4px 0 #4aa8cc; margin-bottom:20px; }
  #tabellone{ width:100%; max-width:340px; flex:1 1 auto; overflow:auto;
    font-family:'Press Start 2P', monospace; font-size:10px; line-height:1.8; }
  #tabellone .riga{ display:flex; align-items:baseline; gap:8px;
    padding:7px 8px; color:#cfcfc8; border:3px solid transparent; }
  #tabellone .riga .pos{ width:2.6em; text-align:right; color:#8a8a84; }
  #tabellone .riga .nome{ flex:1 1 auto; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  #tabellone .riga .punti{ color:#f4f4f0; }
  #tabellone .riga.oro   .pos{ color:#f0b722 } #tabellone .riga.oro   .nome{ color:#f0b722 }
  #tabellone .riga.argento .pos{ color:#cfcfc8 } #tabellone .riga.argento .nome{ color:#cfcfc8 }
  #tabellone .riga.bronzo .pos{ color:#c98a3f } #tabellone .riga.bronzo .nome{ color:#c98a3f }
  /* la riga di chi sta giocando: bordo acceso e l'etichetta TU, come un record
     appena messo su un cabinato */
  #tabellone .riga.io{ border-color:#79c245; background:rgba(121,194,69,.12);
    color:#f4f4f0; }
  #tabellone .riga.io .pos{ color:#79c245 }
  #tabellone .riga .tu{ color:#79c245; font-size:8px; }
  #tabellone .stacco{ margin:12px 0; border-top:3px dashed #4a4a46; }
  #tabellone .stato{ color:#8a8a84; text-align:center; padding:24px 0;
    line-height:2; }

  /* ---- il menu dell'uscita ----
     Copre tutto e ferma il mondo: uscire e' l'unica cosa irreversibile che si
     puo' fare qui dentro, e chiederlo mentre gli ostacoli continuano ad
     arrivare vorrebbe dire farsi ammazzare mentre si decide. */
  #uscita{
    position:absolute; inset:0; z-index:5; pointer-events:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; text-align:center; padding:24px;
    background:rgba(28,28,26,.82); backdrop-filter:blur(3px);
  }
  #uscita[hidden]{ display:none !important; }
  #uscita h2{
    font-family:'Press Start 2P', monospace; font-size:15px; line-height:1.9;
    color:#f4f4f0; margin:0 0 18px; max-width:15em;
  }
  #uscita button{
    font-family:'Press Start 2P', monospace; font-size:13px; letter-spacing:1px;
    margin-top:14px; padding:15px 26px; border-radius:0; cursor:pointer;
    background:#f0b722; color:#2a1d00; border:4px solid #2a1d00;
    box-shadow:0 7px 0 #a97c12, 0 7px 0 4px #2a1d00;
    transition:transform .05s, box-shadow .05s; max-width:16em;
  }
  #uscita button:active{ transform:translateY(5px);
    box-shadow:0 2px 0 #a97c12, 0 2px 0 4px #2a1d00; }
  #uscita button.resto{
    background:#e9e9e4; color:#1d1d1b; border-color:#1d1d1b;
    box-shadow:0 7px 0 #a8a8a0, 0 7px 0 4px #1d1d1b;
  }
  #uscita button.resto:active{ box-shadow:0 2px 0 #a8a8a0, 0 2px 0 4px #1d1d1b; }

  /* ---- il menu dell'ingranaggio ----
     Ferma il gioco, come il menu dell'uscita: e' l'unico posto da cui si
     cambiano le cose, e cambiarle mentre arrivano i carrelli non ha senso. */
  #menu{
    position:absolute; inset:0; z-index:6; pointer-events:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0; text-align:center; padding:24px;
    background:rgba(28,28,26,.86); backdrop-filter:blur(3px);
  }
  #menu[hidden]{ display:none !important; }
  #menu h2{
    font-family:'Press Start 2P', monospace; font-size:16px; line-height:1.8;
    color:#f0b722; text-shadow:3px 3px 0 #100e0d; margin:0 0 22px;
  }
  #menu .voci{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:17em; }
  #menu button{
    font-family:'Press Start 2P', monospace; font-size:12px; letter-spacing:1px;
    padding:14px 12px; border-radius:0; cursor:pointer; width:100%;
    background:#e9e9e4; color:#1d1d1b; border:4px solid #1d1d1b;
    box-shadow:0 6px 0 #a8a8a0, 0 6px 0 4px #1d1d1b;
    transition:transform .05s, box-shadow .05s;
  }
  #menu button:active{ transform:translateY(4px);
    box-shadow:0 2px 0 #a8a8a0, 0 2px 0 4px #1d1d1b; }
  #menu button.primo{
    background:#f0b722; color:#2a1d00; border-color:#2a1d00;
    box-shadow:0 6px 0 #a97c12, 0 6px 0 4px #2a1d00;
  }
  #menu button.primo:active{ box-shadow:0 2px 0 #a97c12, 0 2px 0 4px #2a1d00; }
  #menu button.uscire{ background:#d8564e; color:#2a0b09; border-color:#2a0b09;
    box-shadow:0 6px 0 #8f2f2a, 0 6px 0 4px #2a0b09; }
  #menu button.uscire:active{ box-shadow:0 2px 0 #8f2f2a, 0 2px 0 4px #2a0b09; }
  /* il record in fondo al menu: e' l'informazione che in sala giochi sta
     sempre sotto il titolo, e nella targa non ci sta comoda */
  #menuRecord{ font-family:'Press Start 2P', monospace; font-size:10px;
    color:#8f8880; margin-top:20px; }

  /* La lezione non copre la scena: spiega una cosa che si sta vedendo,
     quindi resta in basso e lascia guardare il corridoio. */
  #lezione{
    position:absolute; left:0; right:0; bottom:0; pointer-events:auto;
    padding:20px 22px calc(24px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, #1c1c1a 0%, rgba(28,28,26,.97) 70%, rgba(28,28,26,.82) 100%);
    box-shadow:0 -30px 60px rgba(28,28,26,.45);
    color:#f4f4f0; text-align:center;
    border-radius:22px 22px 0 0;
    animation: entraLezione .28s ease-out;
  }
  #lezione[hidden]{ display:none !important; }
  @keyframes entraLezione{ from{ transform:translateY(60px); opacity:0 } }
  #lezione h2{ margin:0 0 8px; font-size:20px; letter-spacing:-.3px; }
  #lezione p{ margin:0; font-size:15px; line-height:1.5; color:#cfcfc8; }
  #lezione b.verde{ color:#8fd45a } #lezione b.blu{ color:#63c0e0 }
  #lezione b.rosso{ color:#e8615a }
  #lezione .dita{ font-size:34px; letter-spacing:14px; margin:6px 0 2px; }
  #lezione .dita span{ display:inline-block; animation: spingi 1.1s ease-in-out infinite; }
  #lezione .dita span:last-child{ animation-delay:.55s }
  @keyframes spingi{
    0%,100%{ transform:translateX(0); opacity:.45 }
    50%{ transform:translateX(var(--v,10px)); opacity:1 }
  }
  /* la freccia in giu' si muove in giu', non di lato */
  #lezione .dita span[style*="--v:0"]{ animation-name: spingiGiu; }
  @keyframes spingiGiu{
    0%,100%{ transform:translateY(-6px); opacity:.45 }
    50%{ transform:translateY(10px); opacity:1 }
  }
  #lezione button{
    margin-top:14px; padding:12px 28px; font-size:16px; font-weight:700;
    border:0; border-radius:999px; background:#f4f4f0; color:#1d1d1b;
    font-family:inherit; cursor:pointer;
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>

  <div class="ui">
    <div id="hud">
      <div id="targa">
        <div id="targaAlto">
          <div id="ritratto"><div id="faccia"></div></div>
          <div id="vite"><span>♥</span><span>♥</span><span>♥</span></div>
        </div>
        <div id="targaBasso">
          <img id="anellino" alt="">
          <span id="punti">0</span>
          <span id="record">HI 0</span>
        </div>
      </div>
      <button id="btnIng" aria-label="Menu" hidden></button>
    </div>
    <div id="fps"></div>
  </div>

  <div class="velo" id="veloStart">
    <h1 id="titolo"><span class="r1">APPLE</span><span class="r2">CAMPUS</span><span class="r3">RUN</span></h1>
    <p>Corri nel campus, raccogli tutti gli anelli ed evita gli ostacoli.</p>
    <p>Ogni anello vale punti: più ne collezioni, più in alto salirai in classifica.</p>
    <button id="btnVia">PLAY</button>
    <!-- Stesso bottone della schermata di fine partita, ma qui si vede dalla
         primissima apertura: non serve aver gia' giocato per guardare la
         classifica. Compare solo se il gioco grande ha passato l'identita'
         e il database, come per quello di fine partita. -->
    <button id="btnClassificaInizio" class="secondario" hidden>CLASSIFICA</button>
    <button id="btnEsciStart" class="esci" hidden>ESCI</button>
  </div>

  <div id="menu" hidden>
    <h2>PAUSA</h2>
    <div class="voci">
      <button id="mnRiprendi" class="primo">RIPRENDI</button>
      <button id="mnMusica">MUSICA: ON</button>
      <button id="mnComandi">COME SI GIOCA</button>
      <button id="mnClassifica">CLASSIFICA</button>
      <button id="mnEsci" class="uscire">ESCI DAL GIOCO</button>
    </div>
    <div id="menuRecord">RECORD 0</div>
