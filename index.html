<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>FantaLiberty — Nexus</title>
<!-- GitHub Pages tiene index.html in cache per una decina di minuti: senza questo
     il browser continua a chiedere la versione vecchia degli asset -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="description" content="FantaLiberty: visual novel interattiva. Steve Jobs Theater, WWDC 26.">
<link rel="stylesheet" href="./game/engine.css?v=96">
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <img id="bg2" alt="">
  <div id="sky"></div>

  <!-- I tre pannelli dello schermo del palco (S5) si accendono uno per volta,
       quando il giocatore sceglie un macroargomento. Layer suo, non #propwrap:
       li' durante le domande c'e' gia' la slide della categoria. Sta sopra il
       fondale e sotto i personaggi, e non prende tocchi. -->
  <div id="emblemi" aria-hidden="true">
    <img id="emblema-iphone" alt="">
    <img id="emblema-watch" alt="">
    <img id="emblema-altro" alt="">
  </div>

  <!-- carrellata: le inquadrature che si ingrandiscono e si dissolvono una
       nell'altra (la discesa verso il palco in S2) -->
  <div id="prlx"></div>

  <!-- il fondale si apre in due meta' come un sipario: la tenda della lobby
       (S1 -> S2) e il sipario del palco (S4) sono lo stesso effetto -->
  <div id="tende"><div id="tendaSx"></div><div id="tendaDx"></div></div>

  <!-- reazione della platea: un layer sopra il fondale del palco, assegnato
       sempre a caso e mai in base alla risposta data -->
  <div id="platea"><img id="plateaImg" alt=""></div>

  <!-- NPC: corpo (posa) + testa (espressione), file separati -->
  <div id="npc"><img id="npcBody" alt=""><img id="npcHead" alt=""></div>

  <!-- la figura del giocatore: lo sprite dello stile scelto in S3, da S4 in poi -->
  <div id="avatar"></div>

  <!-- un secondo personaggio, solo per la durata di un evento (il rider) -->
  <div id="ospitewrap"><img id="ospite" alt=""></div>

  <!-- l'oggetto di un micro-evento (il clicker che si inceppa). Slot suo, non
       #propwrap: li' c'e' gia' la slide del macroargomento, e sovrascriverla la
       farebbe sparire per il resto del blocco -->
  <div id="evpropwrap"><img id="evprop" alt=""></div>

  <div id="propwrap">
    <img id="prop" alt="">
    <div id="screen"></div>
  </div>


  <!-- badge dell'accredito: l'immagine porta gia' la mela, il nome del giocatore
       viene scritto sopra dal motore (il template e' vuoto, vedi manifest asset) -->
  <div id="badgewrap">
    <img id="badgeImg" alt="">
    <div id="badgeName"></div>
  </div>
  <div id="coriandoli"></div>

  <!-- hub della lobby: quattro zone che si scorrono di lato. Le aree toccabili
       vengono disegnate dal motore dentro #hubspots, sopra il fondale. -->
  <div id="hub">
    <div id="hubspots"></div>
  </div>

  <!-- S3, la scelta dello stile. Il fondale del camerino va sfocato e scurito:
       l'unica cosa a fuoco e' la figura. Il velo e l'alone sotto i piedi la
       staccano dallo sfondo senza bisogno di un contorno disegnato. -->
  <div id="carosello">
    <div id="carvelo"></div>
    <div id="carluce"></div>
    <img id="carImg" alt="">
    <button id="cprev" class="carfreccia" aria-label="Stile precedente">&#9664;</button>
    <button id="cnext" class="carfreccia" aria-label="Stile successivo">&#9654;</button>
  </div>

  <div id="boxwrap">
    <!-- quiz di Peter (S8): a che punto sei del livello e quanto tempo resta.
         Il timer parte quando la domanda compare, non quando finisci di
         leggerla: per questo il testo non si scrive a macchina. -->
    <div id="quizbar">
      <div id="qinfo"></div>
      <div id="qtimer"><div id="qbar"></div><span id="qsec"></span></div>
    </div>
    <div id="hubnav">
      <button id="hprev" aria-label="Zona precedente">◀</button>
      <div id="hdots"></div>
      <button id="hnext" aria-label="Zona successiva">▶</button>
    </div>
    <!-- la scheda: chi e', in una riga. Nessuna meccanica di gioco qui —
         i perk si spiegano al quiz, non mentre ci si veste. -->
    <div id="carta">
      <div id="cdots"></div>
      <div id="carnome"></div>
      <div id="cardesc"></div>
      <div id="carbattuta"></div>
      <div id="carperk"></div>
      <button id="carok">Scelgo questo</button>
    </div>
    <!-- chi parla. Per una voce in cuffia (Susan, dalla regia) accanto al nome
         compare l'icona dell'auricolare invece di uno sprite in scena -->
    <div id="name" class="hidden"><img id="voce" alt=""><span id="nametxt"></span></div>
    <div id="box"><span id="txt"></span></div>
    <div id="arrow">▼</div>
    <!-- i tre macroargomenti del keynote (S5), e i tre livelli del quiz (S8).
         Sta PRIMA di #choices: nella griglia del quiz i due convivono, e i
         livelli vanno letti prima delle azioni che ci stanno sotto. -->
    <div id="griglia"></div>
    <div id="choices"></div>
    <!-- il recap di S6: tutte le risposte, ancora modificabili, e il bottone
         rosso che chiude le previsioni -->
    <div id="recapwrap">
      <div id="recap"></div>
      <button id="blocca">CONFERMA LE PREVISIONI</button>
    </div>
    <!-- [S8.FINALE]: quello che si e' vinto al quiz si spalma sui tre
         macroargomenti. Nessun tetto per categoria, solo il totale. -->
    <div id="multwrap">
      <div id="multrighe"></div>
      <div id="multresto"></div>
      <button id="multok">CONFERMA</button>
    </div>
    <div id="inputform">
      <input id="ti" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Il tuo nome">
      <button id="tok">OK</button>
    </div>
    <!-- lista a tendina: per le scelte troppo lunghe da fare a bottoni (i 31
         modelli di iPhone). Un <select> vero apre il selettore nativo di iOS. -->
    <div id="listform">
      <select id="tsel" aria-label="Scegli dalla lista"></select>
      <button id="tselok">OK</button>
    </div>
  </div>

  <!-- sipario nero dell'intro: cartello a schermo pieno, poi la scena si accende -->
  <div id="curtain" class="on">
    <div id="curtainInner">
      <div id="logo">
      <img id="logoImg" alt="">
      <div id="logoFallback">8Bit Studios<sup>®</sup></div>
      <div id="logoStem"></div>
    </div>
    <div id="boot">
      <div id="bootbar"></div>
      <div id="bootlabel">LOADING</div>
    </div>
    <div id="curtainTxt"></div>
      <div id="curtainArrow">▼</div>
    </div>
  </div>

  <!-- modale di conferma: per i passi senza ritorno (entrare in sala, scegliere
       lo stile, chiudere i pronostici) -->
  <div id="modal">
    <div id="modalbox">
      <div id="modaltxt"></div>
      <div id="modalbtns"></div>
    </div>
  </div>

  <!-- [S7] la raccolta dell'email, dopo il teleprompter e prima dei titoli di
       coda. E' facoltativa: si continua anche senza, e chi salta lo fa con un
       bottone dichiarato, non con una X nascosta in un angolo. -->
  <div id="emailwrap">
    <div id="emailbox">
      <div id="emailtit"></div>
      <div id="emailtesto"></div>
      <label id="emaillabel" for="emailin"></label>
      <input id="emailin" type="email" inputmode="email" autocomplete="email"
             autocapitalize="off" spellcheck="false">
      <div id="emailerr"></div>
      <div id="emailnota"></div>
      <div id="emailprivacy"></div>
      <button id="emailok" class="ch">CONTINUA</button>
      <button id="emailsalta">Preferisco spezzare loro il cuore</button>
    </div>
  </div>

  <!-- il countdown al keynote vero: e' l'ultima schermata, e quella che il
       giocatore rivede ogni volta che riapre dopo aver confermato le previsioni -->
  <div id="countdown">
    <div id="cdinner">
      <div id="cdnome"></div>
      <div id="cdlabel"></div>
      <div id="cdtempo"></div>
      <div id="cdpunti"></div>
      <div id="cdbtn"></div>
    </div>
  </div>

  <!-- il regolamento (S1, zona 3): si legge e si chiude, non tocca la partita.
       Titolo e bottone restano fermi, scorre solo il corpo. -->
  <div id="regole">
    <div id="regbox">
      <div id="regtit"></div>
      <div id="regcorpo"></div>
      <button id="regok">HO CAPITO</button>
    </div>
  </div>

  <!-- un quadro della Hall of Fame. Si apre da solo, uno per volta: le tre
       si guardano uno alla volta, non tutti insieme dopo il tocco.
       Non e' una scena e non tocca la partita, come il regolamento. -->
  <div id="quadrowrap">
    <img id="quadroImg" alt="">
    <button id="quadrochiudi" class="ch">Chiudi</button>
  </div>

  <!-- Apple Campus Run. Il minigioco vive in una pagina sua (game/runner/) e si
       apre qui sopra la scena, come il regolamento e i quadri: non e' una scena,
       e chiudendolo il giocatore e' esattamente dov'era.
       Il bottone per uscire ce l'ha la corsa dentro di se', sulle sue schermate.
       Questo qui sotto e' solo la via di sicurezza: compare se la pagina non da'
       segni di vita, per non lasciare nessuno chiuso dentro un riquadro nero. -->
  <div id="runwrap">
    <iframe id="runframe" title="Apple Campus Run"></iframe>
    <button id="runchiudi" class="ch" hidden>Chiudi</button>
  </div>

  <!-- la card da salvare: composta su una canvas e mostrata come immagine, cosi'
       su iPhone si tiene premuto per salvarla (il link di download li' apre solo
       una scheda) -->
  <div id="cardwrap">
    <img id="cardImg" alt="">
    <div id="cardazioni">
      <a id="cardsalva" class="ch">Salva l'immagine</a>
      <button id="cardchiudi" class="ch">Chiudi</button>
    </div>
  </div>

  <!-- dissolvenza al nero: copre il cambio di scena (Lucas -> Francesca) senza
       toccare #curtain, che serve all'intro e viene spento a ogni cambio scena -->
  <div id="nero"></div>

  <!-- pannello di sviluppo: si apre solo con ?dev nell'indirizzo -->
  <div id="dev"></div>
  <div id="flash"></div>
  <div id="loaderr">
    <div>
      <div id="loaderrTxt">Il gioco non e' riuscito a partire.</div>
      <button id="loaderrBtn">Riparti da capo</button>
    </div>
  </div>
</div>

<!-- Cartello "manca poco" sul dominio pubblico: si mostra solo su
     fantaliberty.com e sparisce da solo alla data di apertura (vedi lo script
     in fondo). Sull'indirizzo di sviluppo non compare mai. -->
<div id="gate" hidden>
  <div id="gateScena" aria-hidden="true">
    <div class="gateFaro"></div>
    <div class="gatePalco"></div>
    <div class="gatePozza"></div>
    <div class="gateTenda sx"></div>
    <div class="gateTenda dx"></div>
    <div class="gateMantovana"></div>
  </div>
  <div id="gateTesti">
    <p class="gateOcchiello">FANTALIBERTY</p>
    <h1 class="gateTit">PREPARATI<br>A ENTRARE<br>IN SCENA.</h1>
    <p class="gateSub">CI VEDIAMO IL<br><b>2 SETTEMBRE</b></p>
  </div>
</div>

<script src="./game/engine.js?v=96"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var opts = {
    speed: params.get('fast') ? 0 : 36,     // ?fast=1  -> niente typewriter
    scene: params.get('scene') || null,     // ?scene=lobby -> salta a una scena (debug)
    dev: params.has('dev')                  // ?dev -> menu di salto rapido, vedi README
  };
  if (params.get('reset')) { try { localStorage.removeItem('fl_nexus_save_v1'); } catch (e) {} }

  // ---- Cartello di attesa sul sito pubblico -------------------------------
  // Non e' un controllo di accesso: e' un'insegna. Chiunque sappia leggere il
  // sorgente entra lo stesso. Serve solo a non far trovare il gioco aperto a
  // chi passa da fantaliberty.com prima del 2 settembre.
  var DOMINI_PUBBLICI = ['fantaliberty.com', 'www.fantaliberty.com'];
  var APERTURA = Date.parse('2026-09-02T00:00:00+02:00');
  function siApre() {
    if (params.has('apri')) return true;                 // ?apri -> scavalca il cartello
    if (DOMINI_PUBBLICI.indexOf(location.hostname) < 0) return true;
    return Date.now() >= APERTURA;
  }
  if (!siApre()) {
    document.getElementById('gate').hidden = false;
    document.getElementById('stage').hidden = true;
    document.documentElement.classList.add('inattesa');
    return;                                              // il motore non parte proprio
  }

  var ENGINE_ATTESO = '24';   // deve combaciare con VN.engine in game/engine.js
  var partito = false;

  function mostraErrore(msg) {
    var box = document.getElementById('loaderr');
    document.getElementById('loaderrTxt').innerHTML = msg;
    box.classList.add('on');
    document.getElementById('curtain').classList.remove('on');   // via il nero, altrimenti resta muto
  }

  // Paracadute: se dopo otto secondi non e' partito niente (rete, cache rotta,
  // salvataggio incompatibile) si esce dal nero e si offre di ricominciare,
  // invece di lasciare lo schermo nero per sempre.
  setTimeout(function () {
    if (!partito) mostraErrore('Il gioco non e\' riuscito a partire.<br>Puo\' essere la cache del browser.');
  }, 8000);

  document.getElementById('loaderrBtn').onclick = function () {
    try { localStorage.removeItem('fl_nexus_save_v1'); } catch (e) {}
    location.replace(location.pathname + '?r=' + Date.now());    // URL nuovo: bypassa la cache
  };

  function start(story, banca, backend, quiz) {
    // Motore e pagina devono essere della stessa versione: se il browser ne ha
    // mescolate due dalla cache si ricarica una volta sola con un indirizzo
    // nuovo, che la cache non puo' servire.
    if (!window.VN || VN.engine !== ENGINE_ATTESO) {
      var giaProvato = false;
      try { giaProvato = sessionStorage.getItem('fl_reload') === '1'; } catch (e) {}
      if (!giaProvato) {
        try { sessionStorage.setItem('fl_reload', '1'); } catch (e) {}
        return location.replace(location.pathname + '?r=' + Date.now());
      }
      return mostraErrore('Versione del gioco incoerente.<br>Svuota la cache del browser.');
    }
    try { sessionStorage.removeItem('fl_reload'); } catch (e) {}

    try {
      opts.banca = banca;
      opts.backend = backend;
      opts.quiz = quiz;
      VN.boot(story, opts);
      partito = true;
    } catch (e) {
      console.error(e);
      try { localStorage.removeItem('fl_nexus_save_v1'); } catch (e2) {}
      mostraErrore('Errore all\'avvio.<br><small>' + (e && e.message ? e.message : e) + '</small>');
    }
  }

  // STORY_INLINE / BANCA_INLINE vengono definiti dal build single-file
  // (tools/build_single_file.py): in quel caso non serve nessuna richiesta HTTP
  // e il gioco gira anche da file://
  if (window.STORY_INLINE) return start(window.STORY_INLINE, window.BANCA_INLINE, window.BACKEND_INLINE, window.QUIZ_INLINE);

  // La banca dei pronostici sta in un file suo: e' grande quanto tutto il resto
  // dello script (29 domande x 4 stili di battute) e cambia per conto proprio.
  var prendi = function (nome) {
    return fetch('./game/' + nome + '?v=96', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(nome + ': ' + r.status); return r.json(); });
  };
  // backend.json e' facoltativo: senza, la partita si chiude lo stesso e
  // l'invio resta in coda per il prossimo avvio
  Promise.all([
    prendi('story.json'),
    prendi('domande.json'),
    prendi('backend.json').catch(function () { return null; }),
    prendi('quiz.json')
  ])
    .then(function (x) { start(x[0], x[1], x[2], x[3]); })
    .catch(function (e) {
      console.error('gioco non caricato:', e);
      mostraErrore('Non riesco a caricare il gioco.<br><small>' + e + '</small>');
    });
})();
</script>
</body>
</html>
