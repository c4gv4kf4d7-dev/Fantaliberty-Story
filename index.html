<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>FantaLiberty — Nexus</title>
<meta name="description" content="FantaLiberty: visual novel interattiva. Steve Jobs Theater, WWDC 26.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./game/engine.css">
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <img id="char" alt="">

  <div id="propwrap">
    <img id="prop" alt="">
    <div id="screen"></div>
  </div>

  <div id="boxwrap">
    <div id="name" class="hidden"></div>
    <div id="box"><span id="txt"></span></div>
    <div id="arrow">▼</div>
    <div id="choices"></div>
    <div id="inputform">
      <input id="ti" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Il tuo nome">
      <button id="tok">OK</button>
    </div>
  </div>

  <div id="hint">tap per continuare</div>
  <div id="flash"></div>
  <div id="loaderr">Impossibile caricare <b>game/story.json</b>.<br>
    Apri il gioco da un web server (o usa <b>dist/nexus_game.html</b> per l'uso offline).</div>
</div>

<script src="./game/engine.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var opts = { speed: params.get('fast') ? 0 : 36 };

  function start(story) { VN.boot(story, opts); }

  // STORY_INLINE viene definito dal build single-file (tools/build_single_file.py):
  // in quel caso non serve nessuna richiesta HTTP e il gioco gira anche da file://
  if (window.STORY_INLINE) return start(window.STORY_INLINE);

  fetch('./game/story.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(start)
    .catch(function (e) {
      document.getElementById('loaderr').classList.add('on');
      console.error('story.json non caricato:', e);
    });
})();
</script>
</body>
</html>
