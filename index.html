<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>FantaLiberty — Nexus</title>
<meta name="description" content="FantaLiberty: visual novel interattiva. Steve Jobs Theater, WWDC 26.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- il font non deve bloccare l'avvio: si carica in parallelo e si applica appena pronto -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"
      media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="./game/engine.css?v=9">
</head>
<body>
<div id="stage">
  <img id="bg" alt="">

  <!-- NPC: corpo (posa) + testa (espressione), file separati -->
  <div id="npc"><img id="npcBody" alt=""><img id="npcHead" alt=""></div>

  <!-- avatar del giocatore: i 4 layer vengono impilati qui dal motore -->
  <div id="avatar"></div>

  <div id="propwrap">
    <img id="prop" alt="">
    <div id="screen"></div>
  </div>

  <div id="boxwrap">
    <div id="name" class="hidden"></div>
    <div id="box"><span id="txt"></span></div>
    <div id="arrow">▼</div>
    <div id="choices"></div>
    <div id="picker"></div>
    <div id="inputform">
      <input id="ti" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Il tuo nome">
      <button id="tok">OK</button>
    </div>
  </div>

  <!-- sipario nero dell'intro: cartello a schermo pieno, poi la scena si accende -->
  <div id="curtain" class="on">
    <div id="curtainInner">
      <div id="logo">
      <img id="logoImg" alt="">
      <div id="logoFallback">8Bit Studios<sup>®</sup></div>
      <div id="logoStem"></div>
    </div>
    <div id="boot">
      <div id="bootbar"></div>
      <div id="bootlabel">LOADING</div>
    </div>
    <div id="curtainTxt"></div>
      <div id="curtainArrow">▼</div>
    </div>
  </div>

  <div id="hint">tap</div>
  <div id="flash"></div>
  <div id="loaderr">Impossibile caricare <b>game/story.json</b>.<br>
    Apri il gioco da un web server (o usa <b>dist/nexus_game.html</b> per l'uso offline).</div>
</div>

<script src="./game/engine.js?v=9"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var opts = {
    speed: params.get('fast') ? 0 : 36,     // ?fast=1  -> niente typewriter
    scene: params.get('scene') || null      // ?scene=lobby -> salta a una scena (debug)
  };
  if (params.get('reset')) { try { localStorage.removeItem('fl_nexus_save_v1'); } catch (e) {} }

  function start(story) { VN.boot(story, opts); }

  // STORY_INLINE viene definito dal build single-file (tools/build_single_file.py):
  // in quel caso non serve nessuna richiesta HTTP e il gioco gira anche da file://
  if (window.STORY_INLINE) return start(window.STORY_INLINE);

  fetch('./game/story.json?v=9', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(start)
    .catch(function (e) {
      document.getElementById('loaderr').classList.add('on');
      console.error('story.json non caricato:', e);
    });
})();
</script>
</body>
</html>
