<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>FantaLiberty — Nexus</title>
<!-- GitHub Pages tiene index.html in cache per una decina di minuti: senza questo
     il browser continua a chiedere la versione vecchia degli asset -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="description" content="FantaLiberty: visual novel interattiva. Steve Jobs Theater, WWDC 26.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- il font non deve bloccare l'avvio: si carica in parallelo e si applica appena pronto -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"
      media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="./game/engine.css?v=32">
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <img id="bg2" alt="">
  <div id="sky"></div>

  <!-- carrellata: le inquadrature che si ingrandiscono e si dissolvono una
       nell'altra (la discesa verso il palco in S2) -->
  <div id="prlx"></div>

  <!-- il fondale si apre in due meta' come un sipario: la tenda della lobby
       (S1 -> S2) e il sipario del palco (S4) sono lo stesso effetto -->
  <div id="tende"><div id="tendaSx"></div><div id="tendaDx"></div></div>

  <!-- reazione della platea: un layer sopra il fondale del palco, assegnato
       sempre a caso e mai in base alla risposta data -->
  <div id="platea"><img id="plateaImg" alt=""></div>

  <!-- NPC: corpo (posa) + testa (espressione), file separati -->
  <div id="npc"><img id="npcBody" alt=""><img id="npcHead" alt=""></div>

  <!-- la figura del giocatore: lo sprite dello stile scelto in S3, da S4 in poi -->
  <div id="avatar"></div>

  <!-- un secondo personaggio, solo per la durata di un evento (il rider) -->
  <div id="ospitewrap"><img id="ospite" alt=""></div>

  <!-- l'oggetto di un micro-evento (il clicker che si inceppa). Slot suo, non
       #propwrap: li' c'e' gia' la slide del macroargomento, e sovrascriverla la
       farebbe sparire per il resto del blocco -->
  <div id="evpropwrap"><img id="evprop" alt=""></div>

  <div id="propwrap">
    <img id="prop" alt="">
    <div id="screen"></div>
  </div>

  <!-- badge dell'accredito: l'immagine porta gia' la mela, il nome del giocatore
       viene scritto sopra dal motore (il template e' vuoto, vedi manifest asset) -->
  <div id="badgewrap">
    <img id="badgeImg" alt="">
    <div id="badgeName"></div>
  </div>
  <div id="coriandoli"></div>

  <!-- hub della lobby: quattro zone che si scorrono di lato. Le aree toccabili
       vengono disegnate dal motore dentro #hubspots, sopra il fondale. -->
  <div id="hub">
    <div id="hubspots"></div>
  </div>

  <!-- carosello di scelta: la figura in mezzo alla scena, la scheda sotto -->
  <div id="carosello"><img id="carImg" alt=""></div>

  <div id="boxwrap">
    <div id="hubnav">
      <button id="hprev" aria-label="Zona precedente">◀</button>
      <div id="hdots"></div>
      <button id="hnext" aria-label="Zona successiva">▶</button>
    </div>
    <div id="carta">
      <div id="carnav">
        <button id="cprev" aria-label="Precedente">◀</button>
        <div id="cdots"></div>
        <button id="cnext" aria-label="Successivo">▶</button>
      </div>
      <div id="carnome"></div>
      <div id="cardesc"></div>
      <div id="carperk"></div>
      <button id="carok" class="ch">Scelgo questo</button>
    </div>
    <!-- chi parla. Per una voce in cuffia (Martha, dalla regia) accanto al nome
         compare l'icona dell'auricolare invece di uno sprite in scena -->
    <div id="name" class="hidden"><img id="voce" alt=""><span id="nametxt"></span></div>
    <div id="box"><span id="txt"></span></div>
    <div id="arrow">▼</div>
    <div id="choices"></div>
    <!-- i tre macroargomenti del keynote: pannelli con nome e stato -->
    <div id="griglia"></div>
    <!-- il recap di S6: tutte le risposte, ancora modificabili, e il bottone
         rosso che chiude la schedina -->
    <div id="recapwrap">
      <div id="recap"></div>
      <button id="blocca">BLOCCA LA SCALETTA</button>
    </div>
    <div id="inputform">
      <input id="ti" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Il tuo nome">
      <button id="tok">OK</button>
    </div>
    <!-- lista a tendina: per le scelte troppo lunghe da fare a bottoni (i 31
         modelli di iPhone). Un <select> vero apre il selettore nativo di iOS. -->
    <div id="listform">
      <select id="tsel" aria-label="Scegli dalla lista"></select>
      <button id="tselok">OK</button>
    </div>
  </div>

  <!-- sipario nero dell'intro: cartello a schermo pieno, poi la scena si accende -->
  <div id="curtain" class="on">
    <div id="curtainInner">
      <div id="logo">
      <img id="logoImg" alt="">
      <div id="logoFallback">8Bit Studios<sup>®</sup></div>
      <div id="logoStem"></div>
    </div>
    <div id="boot">
      <div id="bootbar"></div>
      <div id="bootlabel">LOADING</div>
    </div>
    <div id="curtainTxt"></div>
      <div id="curtainArrow">▼</div>
    </div>
  </div>

  <!-- modale di conferma: per i passi senza ritorno (entrare in sala, scegliere
       lo stile, chiudere i pronostici) -->
  <div id="modal">
    <div id="modalbox">
      <div id="modaltxt"></div>
      <div id="modalbtns"></div>
    </div>
  </div>

  <!-- il countdown al keynote vero: e' l'ultima schermata, e quella che il
       giocatore rivede ogni volta che riapre dopo aver bloccato la scaletta -->
  <div id="countdown">
    <div id="cdinner">
      <div id="cdnome"></div>
      <div id="cdlabel"></div>
      <div id="cdtempo"></div>
      <div id="cdpunti"></div>
      <div id="cdbtn"></div>
    </div>
  </div>

  <!-- la card da salvare: composta su una canvas e mostrata come immagine, cosi'
       su iPhone si tiene premuto per salvarla (il link di download li' apre solo
       una scheda) -->
  <div id="cardwrap">
    <img id="cardImg" alt="">
    <div id="cardazioni">
      <a id="cardsalva" class="ch">Salva l'immagine</a>
      <button id="cardchiudi" class="ch">Chiudi</button>
    </div>
  </div>

  <!-- dissolvenza al nero: copre il cambio di scena (Lucas -> Francesca) senza
       toccare #curtain, che serve all'intro e viene spento a ogni cambio scena -->
  <div id="nero"></div>

  <!-- pannello di sviluppo: si apre solo con ?dev nell'indirizzo -->
  <div id="dev"></div>
  <div id="flash"></div>
  <div id="loaderr">
    <div>
      <div id="loaderrTxt">Il gioco non e' riuscito a partire.</div>
      <button id="loaderrBtn">Riparti da capo</button>
    </div>
  </div>
</div>

<script src="./game/engine.js?v=32"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var opts = {
    speed: params.get('fast') ? 0 : 36,     // ?fast=1  -> niente typewriter
    scene: params.get('scene') || null,     // ?scene=lobby -> salta a una scena (debug)
    dev: params.has('dev')                  // ?dev -> menu di salto rapido, vedi README
  };
  if (params.get('reset')) { try { localStorage.removeItem('fl_nexus_save_v1'); } catch (e) {} }

  var ENGINE_ATTESO = '11';   // deve combaciare con VN.engine in game/engine.js
  var partito = false;

  function mostraErrore(msg) {
    var box = document.getElementById('loaderr');
    document.getElementById('loaderrTxt').innerHTML = msg;
    box.classList.add('on');
    document.getElementById('curtain').classList.remove('on');   // via il nero, altrimenti resta muto
  }

  // Paracadute: se dopo otto secondi non e' partito niente (rete, cache rotta,
  // salvataggio incompatibile) si esce dal nero e si offre di ricominciare,
  // invece di lasciare lo schermo nero per sempre.
  setTimeout(function () {
    if (!partito) mostraErrore('Il gioco non e\' riuscito a partire.<br>Puo\' essere la cache del browser.');
  }, 8000);

  document.getElementById('loaderrBtn').onclick = function () {
    try { localStorage.removeItem('fl_nexus_save_v1'); } catch (e) {}
    location.replace(location.pathname + '?r=' + Date.now());    // URL nuovo: bypassa la cache
  };

  function start(story, banca, backend) {
    // Motore e pagina devono essere della stessa versione: se il browser ne ha
    // mescolate due dalla cache si ricarica una volta sola con un indirizzo
    // nuovo, che la cache non puo' servire.
    if (!window.VN || VN.engine !== ENGINE_ATTESO) {
      var giaProvato = false;
      try { giaProvato = sessionStorage.getItem('fl_reload') === '1'; } catch (e) {}
      if (!giaProvato) {
        try { sessionStorage.setItem('fl_reload', '1'); } catch (e) {}
        return location.replace(location.pathname + '?r=' + Date.now());
      }
      return mostraErrore('Versione del gioco incoerente.<br>Svuota la cache del browser.');
    }
    try { sessionStorage.removeItem('fl_reload'); } catch (e) {}

    try {
      opts.banca = banca;
      opts.backend = backend;
      VN.boot(story, opts);
      partito = true;
    } catch (e) {
      console.error(e);
      try { localStorage.removeItem('fl_nexus_save_v1'); } catch (e2) {}
      mostraErrore('Errore all\'avvio.<br><small>' + (e && e.message ? e.message : e) + '</small>');
    }
  }

  // STORY_INLINE / BANCA_INLINE vengono definiti dal build single-file
  // (tools/build_single_file.py): in quel caso non serve nessuna richiesta HTTP
  // e il gioco gira anche da file://
  if (window.STORY_INLINE) return start(window.STORY_INLINE, window.BANCA_INLINE, window.BACKEND_INLINE);

  // La banca dei pronostici sta in un file suo: e' grande quanto tutto il resto
  // dello script (29 domande x 4 stili di battute) e cambia per conto proprio.
  var prendi = function (nome) {
    return fetch('./game/' + nome + '?v=32', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(nome + ': ' + r.status); return r.json(); });
  };
  // backend.json e' facoltativo: senza, la partita si chiude lo stesso e
  // l'invio resta in coda per il prossimo avvio
  Promise.all([
    prendi('story.json'),
    prendi('domande.json'),
    prendi('backend.json').catch(function () { return null; })
  ])
    .then(function (x) { start(x[0], x[1], x[2]); })
    .catch(function (e) {
      console.error('gioco non caricato:', e);
      mostraErrore('Non riesco a caricare il gioco.<br><small>' + e + '</small>');
    });
})();
</script>
</body>
</html>
